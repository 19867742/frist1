name: 构建 APK

# 无需本机安装 Android Studio：推到 GitHub 后自动在云端编译出 APK
# 位置要求：仓库根目录同时包含 finance-app/ 与 android-app/
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 同步网页端资源
        run: |
          mkdir -p android-app/app/src/main/assets/www
          cp -r finance-app/index.html finance-app/manifest.webmanifest finance-app/sw.js \
                finance-app/css finance-app/js finance-app/icons \
                android-app/app/src/main/assets/www/

      - name: 构建调试版 APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowAtlas-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
