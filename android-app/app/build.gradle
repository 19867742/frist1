plugins { id 'com.android.application' }

android {
    namespace 'com.flowatlas.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.flowatlas.app"
        minSdk 29                 // 华为 nova9（HarmonyOS 2/4）为 Android 10+，可用 MediaStore 直接写入「下载」
        targetSdk 34
        versionCode 1
        versionName "1.0"
        resConfigs "zh", "en"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 自签名调试密钥即可安装；如需正式发布请自行配置签名
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions { resources.excludes += ['META-INF/*'] }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
