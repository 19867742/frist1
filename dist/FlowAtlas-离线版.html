<style>
/* FlowAtlas · 流水图鉴 样式表
   设计目标：图形优先、色彩丰富、单手可操作（华为 nova9 等 6.5~6.9 寸机型） */

:root {
  --accent: #4D96FF;
  --accent2: #8E7CFF;
  --expense: #FF6B6B;
  --income: #22C55E;
  --warn: #F59E0B;
  --danger: #EF4444;
  --bg: #F4F6FB;
  --bg-soft: #EAEEF7;
  --card: #FFFFFF;
  --card-2: #F8FAFD;
  --text: #16203A;
  --text-dim: #7C8BA1;
  --line: rgba(22, 32, 58, .08);
  --shadow: 0 6px 22px rgba(22, 32, 58, .07);
  --shadow-lg: 0 14px 44px rgba(22, 32, 58, .16);
  --radius: 20px;
  --radius-sm: 14px;
  --tab-h: 62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --sheet: #FFFFFF;
}
[data-theme="dark"] {
  --bg: #0B1220;
  --bg-soft: #121B2E;
  --card: #16203A;
  --card-2: #1B2743;
  --text: #EDF2FF;
  --text-dim: #93A2C4;
  --line: rgba(255, 255, 255, .09);
  --shadow: 0 6px 22px rgba(0, 0, 0, .35);
  --shadow-lg: 0 16px 48px rgba(0, 0, 0, .5);
  --sheet: #16203A;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 15px; line-height: 1.45; overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .55;
  background:
    radial-gradient(560px 300px at 12% -8%, rgba(77, 150, 255, .28), transparent 65%),
    radial-gradient(520px 320px at 100% 4%, rgba(244, 115, 185, .22), transparent 62%),
    radial-gradient(600px 360px at 50% 108%, rgba(46, 211, 183, .2), transparent 66%);
}
[data-theme="dark"] body::before { opacity: .5; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
.money { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; font-weight: 700; }
.pos { color: var(--income); } .neg { color: var(--expense); } .dim { color: var(--text-dim); font-weight: 500; }
.link { color: var(--accent); font-size: 13px; font-weight: 600; }
.ic { display: block; }
/* ---------------- 插图 ---------------- */
.illust { display: block; border-radius: 30%; flex: 0 0 auto; }
.section-title .illust, .sec-head .illust { width: 26px; height: 26px; border-radius: 9px; }
.sec-head { display: flex; align-items: center; gap: 8px; }
.txn-icon .illust { width: 100%; height: 100%; border-radius: 15px; }
.quick-ic .illust { width: 100%; height: 100%; border-radius: 15px; }
.cat-cell-ic .illust { width: 100%; height: 100%; border-radius: 14px; }
.detail-cat .illust { width: 58px; height: 58px; border-radius: 18px; margin: 0 auto; }
.empty .illust { width: 92px; height: 92px; border-radius: 26px; margin: 0 auto 12px; }
.hero-art { position: absolute; right: 8px; bottom: 12px; width: 104px; height: 104px; opacity: .92; transform: rotate(-7deg); }
.hero-art .illust { width: 100%; height: 100%; border-radius: 30px; }
.drop-zone .illust { width: 76px; height: 76px; border-radius: 22px; margin: 0 auto 8px; }
.detect-row .illust, .notif-item .illust { width: 38px; height: 38px; border-radius: 13px; }
.group-illust { width: 34px; height: 34px; border-radius: 12px; }
.mod-banner { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.mod-banner .illust { width: 54px; height: 54px; border-radius: 17px; }
.mod-banner-t { font-size: 15px; font-weight: 800; }
.mod-banner-d { font-size: 11.5px; color: var(--text-dim); }
.empty-illust { width: 92px; height: 92px; border-radius: 26px; margin: 0 auto 12px; }
canvas { display: block; max-width: 100%; }

/* ---------------- 骨架 ---------------- */
#app { position: relative; z-index: 1; min-height: 100vh; }
#topbar {
  position: sticky; top: 0; z-index: 30; padding: calc(var(--safe-t) + 10px) 16px 10px;
  backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  border-bottom: 1px solid transparent; transition: border-color .2s;
}
#topbar .topbar-inner { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.topbar-greet { font-size: 12px; color: var(--text-dim); font-weight: 500; }
.topbar-name { font-size: 22px; font-weight: 800; letter-spacing: -.4px; }
.topbar-title.simple .topbar-name { font-size: 19px; }
.topbar-actions { display: flex; gap: 6px; align-items: center; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center;
  background: var(--card); box-shadow: var(--shadow); color: var(--text-dim);
}
.icon-btn:active { transform: scale(.94); }
.icon-btn.avatar {
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
  font-weight: 800; font-size: 15px;
}
#view { padding: 4px 16px calc(var(--tab-h) + var(--safe-b) + 30px); }
.page { animation: pageIn .28s cubic-bezier(.22, .8, .3, 1); }
@keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

#tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-around;
  height: calc(var(--tab-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-top: 1px solid var(--line);
}
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-dim); font-size: 10.5px; font-weight: 600; padding: 8px 0; }
.tab.on { color: var(--accent); }
.tab.on .ic { transform: translateY(-1px) scale(1.06); }
.tab.fab {
  flex: 0 0 62px; width: 62px; height: 62px; margin-top: -26px; border-radius: 22px; color: #fff;
  background: linear-gradient(140deg, #4D96FF, #8E7CFF 55%, #F473B9);
  box-shadow: 0 10px 26px rgba(77, 150, 255, .45); display: grid; place-items: center;
}
.tab.fab:active { transform: scale(.93); }

/* ---------------- 通用卡片 ---------------- */
.card {
  background: var(--card); border-radius: var(--radius); padding: 14px 16px;
  box-shadow: var(--shadow); border: 1px solid var(--line); margin-bottom: 12px;
}
.section-title {
  display: flex; align-items: center; justify-content: space-between;
  margin: 20px 2px 9px; font-size: 14.5px; font-weight: 800; letter-spacing: -.2px;
}
.list-card { padding: 4px 10px; }
.chips-input { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  padding: 6px 12px; border-radius: 999px; background: var(--bg-soft); color: var(--text-dim);
  font-size: 12.5px; font-weight: 600; transition: .16s; border: 1px solid transparent;
}
.chip.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 4px 14px rgba(77, 150, 255, .3); }
.chip.mini { padding: 3px 9px; font-size: 11px; }
.chip.ghost { background: transparent; border: 1px dashed var(--line); display: inline-flex; align-items: center; gap: 4px; }
.chip-row { display: flex; gap: 7px; overflow-x: auto; padding: 8px 0 10px; scrollbar-width: none; }
.chip-row::-webkit-scrollbar { display: none; }
.cat-chip { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }

.btn {
  border-radius: 15px; padding: 13px 18px; font-weight: 700; font-size: 15px;
  background: var(--card-2); color: var(--text); border: 1px solid var(--line);
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: .16s;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(135deg, #4D96FF, #6E7BFF 60%, #8E7CFF); color: #fff; border: 0; box-shadow: 0 8px 22px rgba(77, 150, 255, .34); }
.btn.danger { background: linear-gradient(135deg, #FF6B6B, #EF4444); color: #fff; border: 0; }
.btn.ghost { background: transparent; }
.btn.small { padding: 8px 13px; font-size: 13px; border-radius: 12px; }
.btn.block { width: 100%; margin-top: 6px; }
.btn.grow { flex: 1; }
.mt { margin-top: 12px; }
.row-btns { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
.row-btns.col { flex-direction: column; }

.tips {
  background: color-mix(in srgb, var(--accent) 8%, transparent); border: 1px dashed color-mix(in srgb, var(--accent) 35%, transparent);
  border-radius: var(--radius-sm); padding: 12px 14px; font-size: 12.5px; color: var(--text-dim); line-height: 1.65; margin: 12px 0;
}
.tips b { color: var(--text); display: block; margin-bottom: 4px; }
.pbar { height: 8px; border-radius: 999px; background: var(--bg-soft); overflow: hidden; }
.pbar-fill { height: 100%; border-radius: 999px; transition: width .5s cubic-bezier(.3, .9, .3, 1); }
.switch { width: 46px; height: 28px; border-radius: 999px; background: var(--bg-soft); display: inline-flex; align-items: center; padding: 3px; transition: .2s; }
.switch.on { background: linear-gradient(135deg, #22C55E, #16A34A); }
.switch-knob { width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .25); transition: .2s; }
.switch.on .switch-knob { transform: translateX(18px); }
.avatar-ic { display: inline-grid; place-items: center; border-radius: 14px; flex: 0 0 auto; }
.empty { text-align: center; padding: 42px 18px; color: var(--text-dim); }
.empty-emoji { font-size: 46px; margin-bottom: 10px; }
.empty-title { font-size: 15.5px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.empty-desc { font-size: 12.5px; }

/* ---------------- 首页 ---------------- */
.hero-card {
  position: relative; border-radius: 26px; padding: 20px; margin-bottom: 14px; overflow: hidden;
  background: linear-gradient(135deg, #2B3A67 0%, #4D5DBB 45%, #8E7CFF 100%);
  color: #fff; box-shadow: 0 16px 40px rgba(77, 93, 187, .32);
}
[data-theme="dark"] .hero-card { background: linear-gradient(135deg, #16203A, #2B3A67 55%, #4D3F8F); }
.hero-card.has-cover { background-size: cover; background-position: center; }

  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(18,26,48,.80), rgba(60,48,110,.62) 55%, rgba(28,38,80,.76));
}
.hero-art { z-index: 1; }
.hero-bg {
  position: absolute; inset: -40% -10% auto auto; width: 260px; height: 260px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, .5), transparent 60%);
  filter: blur(6px); opacity: .5;
}
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; position: relative; }
.hero-label { font-size: 12px; opacity: .8; font-weight: 600; }
.hero-net { font-size: 34px; font-weight: 800; letter-spacing: -1px; margin-top: 2px; }
.hero-badge { padding: 5px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 800; background: rgba(255, 255, 255, .18); }
.hero-badge.down { background: rgba(255, 107, 107, .3); }
.hero-split { display: flex; gap: 26px; margin-top: 16px; position: relative; }
.hero-k { font-size: 11.5px; opacity: .78; display: block; font-weight: 600; }
.hero-v { font-size: 16px; font-weight: 700; }
.hero-months { display: flex; gap: 6px; overflow-x: auto; margin-top: 16px; position: relative; scrollbar-width: none; }
.hero-months::-webkit-scrollbar { display: none; }
.hero-months .chip { background: rgba(255, 255, 255, .16); color: #fff; }
.hero-months .chip.on { background: #fff; color: #2B3A67; }

.month-card { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 16px; }
.mcard-left { display: flex; flex-direction: column; gap: 8px; }
.mc-item { display: flex; flex-direction: column; }
.mc-k { font-size: 11.5px; color: var(--text-dim); font-weight: 600; }
.mc-v { font-size: 19px; font-weight: 800; }
.mc-v.expense { color: var(--expense); } .mc-v.income { color: var(--income); }
.mcard-right { position: relative; }
.ring-cap { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 2px; font-weight: 600; }
.mcard-foot { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); border-top: 1px solid var(--line); padding-top: 9px; }

.quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0 4px; }
.quick-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); border: 1px solid var(--line); }
.quick-cell:active { transform: scale(.95); }
.quick-ic { width: 42px; height: 42px; border-radius: 15px; display: grid; place-items: center; font-size: 21px; }
.quick-name { font-size: 11.5px; font-weight: 700; color: var(--text-dim); }

.alert-strip { display: flex; align-items: center; gap: 11px; background: linear-gradient(120deg, #FFF3E0, #FFE9F1); border-radius: 18px; padding: 13px 15px; margin: 12px 0; border: 1px solid rgba(245, 158, 11, .25); }
[data-theme="dark"] .alert-strip { background: linear-gradient(120deg, rgba(245, 158, 11, .16), rgba(244, 115, 185, .14)); }
.alert-ic { font-size: 22px; }
.alert-title { font-weight: 700; font-size: 13.5px; }
.alert-desc { font-size: 12px; color: var(--text-dim); }
.alert-count { margin-left: auto; background: var(--danger); color: #fff; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 700; }

.insight-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
.insight-scroll::-webkit-scrollbar { display: none; }
.insight-chip { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); font-size: 12.5px; font-weight: 600; max-width: 84vw; border: 1px solid var(--line); }
.insight-chip.good { border-color: rgba(34, 197, 94, .35); }
.insight-chip.warn { border-color: rgba(245, 158, 11, .4); }
.ins-ic { font-size: 17px; }
.insight-list { display: flex; flex-direction: column; gap: 8px; }
.insight-row { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.insight-row.warn { border-left: 3px solid var(--warn); }
.insight-row.good { border-left: 3px solid var(--income); }
.insight-row.flat { border-left: 3px solid var(--accent); }

.budget-mini .bm-row { margin: 9px 0; }
.bm-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; }

/* ---------------- 流水 ---------------- */
.search-row { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 15px; padding: 10px 12px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.search-ic { color: var(--text-dim); display: flex; }
.search-input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 14.5px; }
.tx-sum-bar { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-dim); padding: 8px 4px; font-weight: 600; }
.tx-sum-bar .income { color: var(--income); } .tx-sum-bar .expense { color: var(--expense); }
.day-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 6px 6px; font-size: 12.5px; font-weight: 800; color: var(--text-dim); }
.day-sum { font-weight: 600; }
.txn-row { display: flex; align-items: center; gap: 11px; padding: 10px 6px; border-bottom: 1px solid var(--line); position: relative; }
.txn-row:last-child { border-bottom: 0; }
.txn-row:active { background: var(--bg-soft); }
.txn-row.excluded { opacity: .5; }
.txn-row.selected { background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 12px; }
.txn-icon { width: 42px; height: 42px; border-radius: 15px; display: grid; place-items: center; font-size: 20px; flex: 0 0 auto; }
.txn-main { flex: 1; min-width: 0; }
.txn-title { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txn-sub { font-size: 11.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txn-amount { text-align: right; font-size: 15px; }
.txn-badge { font-size: 10px; color: var(--warn); font-weight: 700; }
.sel-check { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; flex: 0 0 auto; }
.sel-check.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.sel-bar { position: fixed; left: 12px; right: 12px; bottom: calc(var(--tab-h) + var(--safe-b) + 10px); background: var(--card); border-radius: 18px; box-shadow: var(--shadow-lg); padding: 10px 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; z-index: 35; border: 1px solid var(--line); }
.sel-acts { display: flex; gap: 6px; margin-left: auto; overflow-x: auto; }

/* ---------------- 弹层 ---------------- */
#sheet-root { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
#sheet-root.active { pointer-events: auto; }
.sheet-overlay { position: absolute; inset: 0; background: rgba(11, 18, 32, .45); opacity: 0; transition: opacity .24s; display: flex; align-items: flex-end; backdrop-filter: blur(2px); }
.sheet-overlay.in { opacity: 1; }
.sheet-panel { width: 100%; max-height: 92vh; background: var(--sheet); border-radius: 26px 26px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .3s cubic-bezier(.22, .9, .3, 1); box-shadow: var(--shadow-lg); padding-bottom: var(--safe-b); }
.sheet-overlay.in .sheet-panel { transform: none; }
.sheet-head { padding: 8px 16px 6px; flex: 0 0 auto; }
.sheet-grab { width: 40px; height: 4px; border-radius: 999px; background: var(--line); margin: 0 auto 10px; }
.sheet-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.sheet-title { font-size: 17px; font-weight: 800; }
.sheet-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
.sheet-body { padding: 8px 16px 22px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
.sheet-actions .btn { flex: 1; }
.action-list { display: flex; flex-direction: column; }
.action-item { display: flex; align-items: center; gap: 13px; padding: 15px 6px; border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 600; text-align: left; }
.action-item:last-child { border-bottom: 0; }
.action-item.danger { color: var(--danger); }
.action-icon { width: 34px; height: 34px; border-radius: 12px; background: var(--bg-soft); display: grid; place-items: center; font-size: 17px; color: var(--text-dim); }
.action-item.danger .action-icon { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
.action-hint { margin-left: auto; font-size: 12px; color: var(--text-dim); font-weight: 500; }
.confirm-body p { font-size: 14px; color: var(--text-dim); line-height: 1.65; }

.form { display: flex; flex-wrap: wrap; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.field.half { width: calc(50% - 6px); }
.field-label { font-size: 12.5px; font-weight: 700; color: var(--text-dim); }
.field-input { width: 100%; border: 1px solid var(--line); background: var(--bg-soft); border-radius: 14px; padding: 12px 13px; font-size: 15px; outline: 0; transition: .18s; }
.field-input:focus { border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent); }
.field-hint { font-size: 11.5px; color: var(--text-dim); }
select.field-input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%); background-position: calc(100% - 18px) 20px, calc(100% - 13px) 20px; background-size: 5px 5px; background-repeat: no-repeat; }

#toast-root { position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + var(--safe-b) + 24px); z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }

.sub-wrap { margin-top: 14px; }
.seg { display: flex; gap: 4px; background: var(--bg-soft); padding: 4px; border-radius: 15px; }
.seg button { flex: 1; padding: 9px 6px; border-radius: 12px; font-size: 13px; font-weight: 700; color: var(--text-dim); }

.steps { display: flex; gap: 8px; margin-bottom: 6px; }

.inline-form .field { margin-bottom: 4px; }

.map-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }

.bh-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }

.sc-amt { text-align: right; font-weight: 800; }
.sc-amt .dim { font-size: 11px; font-weight: 600; }
.detect-row { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.detect-row:last-child { border-bottom: 0; }
.detect-mid { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; }
.detect-mid .dim { font-size: 11px; font-weight: 500; }
.account-card { display: flex; align-items: center; gap: 12px; }

/* ---------------- 报告 ---------------- */
.report-months { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none; }
.report-months::-webkit-scrollbar { display: none; }
.report-hero { padding: 16px; background: linear-gradient(140deg, color-mix(in srgb, var(--accent) 10%, var(--card)), var(--card)); }
.rh-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.rh-cell { display: flex; flex-direction: column; gap: 2px; }
.rh-k { font-size: 11.5px; color: var(--text-dim); font-weight: 700; }
.rh-v { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
.rh-v.expense { color: var(--expense); } .rh-v.income { color: var(--income); }
.rh-d { font-size: 11px; color: var(--text-dim); font-weight: 600; }
.rh-d.up { color: var(--expense); } .rh-d.down { color: var(--income); }
.cat-card { padding: 12px 14px; }
.donut-wrap { display: flex; justify-content: center; }
.legend { margin-top: 8px; }
.legend-row { display: flex; align-items: center; gap: 9px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }

.legend-dot { width: 11px; height: 11px; border-radius: 4px; flex: 0 0 auto; }

.legend-count { font-size: 11px; color: var(--text-dim); }
.legend-amt { font-weight: 700; }
.legend-pct { flex: 0 0 42px; text-align: right; color: var(--text-dim); font-size: 12px; font-weight: 700; }
.chart-legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; align-items: center; }
.chart-legend .dot, .heat-legend .hl { width: 11px; height: 11px; border-radius: 4px; display: inline-block; margin-right: 5px; }

.bs-row:last-child { border-bottom: 0; }
.bs-row.total { font-size: 16px; font-weight: 800; }

/* ---------------- 我的 ---------------- */

.rule-mid { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; }
.rule-kw { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

/* ---------------- 锁屏 ---------------- */
#lock { position: fixed; inset: 0; z-index: 200; background: linear-gradient(160deg, #1B2743, #2B3A67 50%, #4D3F8F); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #fff; padding: 30px; }
#lock .lock-logo { font-size: 54px; }

@media (max-width: 360px) {
  .quick-grid { grid-template-columns: repeat(4, 1fr); }

}

}

<script>/* ==== js/util.js ==== */
/* FlowAtlas · 基础工具层 */
(function (root) {
  'use strict';
  var FA = (root.FA = root.FA || {});
  var U = (FA.util = {});

  U.uid = function (p) {
    return (p || 'id') + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  };
  U.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  U.pad2 = function (n) { return (n < 10 ? '0' : '') + n; };
  U.round2 = function (n) { return Math.round((Number(n) || 0) * 100) / 100; };
  U.num = function (v, d) { var n = parseFloat(v); return isFinite(n) ? n : (d || 0); };

  /* ---------- 金额 / 日期 ---------- */
  U.money = function (n, opt) {
    opt = opt || {};
    var v = Number(n) || 0, neg = v < 0;
    v = Math.abs(v);
    var s = v.toFixed(opt.dec == null ? 2 : opt.dec);
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    s = parts.join('.');
    if (opt.symbol !== false) s = '¥' + s;
    return (neg ? '-' : '') + s;
  };
  U.moneyShort = function (n) {
    var v = Math.abs(Number(n) || 0), s;
    if (v >= 1e8) s = (v / 1e8).toFixed(2) + '亿';
    else if (v >= 1e4) s = (v / 1e4).toFixed(v >= 1e5 ? 1 : 2) + '万';
    else s = v.toFixed(0);
    return (Number(n) < 0 ? '-' : '') + s;
  };

  U.ym = function (d) { d = new Date(d); return d.getFullYear() + '-' + U.pad2(d.getMonth() + 1); };
  U.ymd = function (d) { d = new Date(d); return d.getFullYear() + '-' + U.pad2(d.getMonth() + 1) + '-' + U.pad2(d.getDate()); };
  U.dayStart = function (d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); };
  U.monthRange = function (ym) {
    var p = String(ym).split('-'), y = +p[0], m = +p[1];
    return { start: new Date(y, m - 1, 1, 0, 0, 0, 0).getTime(), end: new Date(y, m, 1, 0, 0, 0, 0).getTime() };
  };
  U.addMonths = function (ym, n) {
    var p = String(ym).split('-'), d = new Date(+p[0], +p[1] - 1 + n, 1);
    return U.ym(d);
  };
  U.monthLabel = function (ym) { var p = String(ym).split('-'); return p[0] + '年' + (+p[1]) + '月'; };
  U.weekCN = ['日', '一', '二', '三', '四', '五', '六'];

  U.fmtDate = function (ts, style) {
    var d = new Date(ts);
    if (style === 'time') return U.pad2(d.getHours()) + ':' + U.pad2(d.getMinutes());
    if (style === 'full') return U.ymd(d) + ' ' + U.pad2(d.getHours()) + ':' + U.pad2(d.getMinutes());
    if (style === 'md') return U.pad2(d.getMonth() + 1) + '月' + U.pad2(d.getDate()) + '日';
    return U.ymd(d);
  };
  U.relDay = function (ts) {
    var today = U.dayStart(Date.now()), day = U.dayStart(ts), diff = Math.round((today - day) / 86400000);
    if (diff === 0) return '今天';
    if (diff === 1) return '昨天';
    if (diff === 2) return '前天';
    var d = new Date(ts);
    return U.pad2(d.getMonth() + 1) + '月' + U.pad2(d.getDate()) + '日 周' + U.weekCN[d.getDay()];
  };

  /* 兼容微信 / 支付宝 / 银行 / 手工的多种时间写法 */
  U.parseDate = function (s) {
    if (s == null || s === '') return NaN;
    if (typeof s === 'number') return s < 1e12 ? s * 1000 : s;
    if (s instanceof Date) return s.getTime();
    var t = String(s).trim().replace(/[年月]/g, '-').replace(/日/g, ' ').replace(/\//g, '-').replace(/\./g, '-');

    R('salary', '工资', ['工资', '薪资', '薪酬', '代发', '劳务费', '薪金', '月薪', '岗位工资', '补助']),
    R('bonus', '年终奖', ['年终奖', '奖金', '绩效', '提成', '分红奖']),
    R('parttime', '外快', ['兼职', '外快', '稿费', '讲座费', '咨询费', '接单', '佣金']),
    R('reimburse', '报销', ['报销', '差旅', '补助报销', '费用报销']),
    R('refund', '退款', ['退款', '退货', '退单', '已退', '撤销']),
    R('giftin', '红包收入', ['红包', '转账红包', '礼金']),
    R('interest', '利息', ['利息', '活期结息', '存款利息', '收益发放']),
    R('invest', '投资收益', ['基金赎回', '股票卖出', '分红', '理财赎回', '收益']),
    /* 转账/资金类 */
    R('transfer', '内部转账', ['转账', '转入', '转出', '零钱通', '余额宝', '提现', '充值', '还款', '信用卡还款', '银行卡转入', '资金归集'])
  ];

  /* 方向修正词 */
  var KW_INCOME = ['工资', '薪资', '薪酬', '代发', '报销', '退款', '退税', '利息', '收益', '分红', '奖金', '红包', '收款', '转入', '退款成功', '结息', '退货'];
  var KW_TRANSFER = ['转账', '提现', '充值', '还款', '余额宝', '零钱通', '资金归集', '信用卡还款', '自动转入'];
  var KW_REFUND = ['退款', '退货', '退单', '已退款', '退款成功'];

  C._ruleIndex = null;
  C.buildIndex = function () {
    var idx = [];
    C.RULES.forEach(function (r) {
      r.k.forEach(function (kw) { idx.push({ kw: kw.toLowerCase(), c: r.c, s: r.s, len: kw.length }); });
    });
    idx.sort(function (a, b) { return b.len - a.len; });
    C._ruleIndex = idx;
    return idx;
  };

  /* 单条交易分类：返回 {category, sub, tags, source, confidence} */
  C.classify = function (t, opt) {
    opt = opt || {};
    var merchant = C.normalizeMerchant(t.merchant) || '';
    var item = String(t.item || '');
    var rawCat = String(t.rawCategory || '');
    var note = String(t.note || '');
    var hay = (merchant + ' ' + item + ' ' + rawCat + ' ' + note).toLowerCase();
    var tags = [];

    /* 1) 用户纠正优先（记忆） */
    var key = C.merchantKey(t);
    var corr = (opt.corrections || []).filter(function (x) { return x.key === key; })[0];
    if (corr && corr.category) {
      return { category: corr.category, sub: corr.sub || '', source: 'memory', confidence: 0.99, tags: tags };
    }
    /* 2) 精确别名规则 */
    var alias = C.aliasOf(merchant);
    if (alias !== merchant && opt.aliasRules && opt.aliasRules[alias]) {
      var ar = opt.aliasRules[alias];
      return { category: ar.c, sub: ar.s || '', source: 'alias', confidence: 0.95, tags: tags };
    }
    /* 3) 关键词规则：先匹配「商户名+交易类型」（高精度），再退到全文 */
    if (!C._ruleIndex) C.buildIndex();
    var primary = (merchant + ' ' + rawCat).toLowerCase();
    var scan = function (h2) {
      for (var i = 0; i < C._ruleIndex.length; i++) {
        if (h2.indexOf(C._ruleIndex[i].kw) >= 0) return C._ruleIndex[i];
      }
      return null;
    };
    var best = scan(primary) || scan(hay);
    if (best) {
      tags.push('规则:' + best.kw);
      return { category: best.c, sub: best.s, source: 'rule', confidence: 0.9, tags: tags, hit: best.kw };
    }
    /* 4) 本地贝叶斯（用户历史学习） */
    if (opt.model) {
      var g = C.predict(opt.model, merchant + ' ' + item + ' ' + rawCat);
      if (g && g.confidence >= 0.55) {
        return { category: g.category, sub: g.sub || '', source: 'model', confidence: g.confidence, tags: ['模型'] };
      }
    }
    /* 5) 兜底 */
    var dir = C.guessDirection(hay, t);
    var fallback = t.direction === 'income' ? (dir.income || 'incother') : (dir.expense || 'other');
    return { category: fallback, sub: '', source: 'fallback', confidence: 0.3, tags: tags };
  };

  C.guessDirection = function (hay, t) {
    var has = function (arr) { return arr.some(function (k) { return hay.indexOf(k.toLowerCase()) >= 0; }); };
    return {
      income: has(KW_INCOME) ? 'incother' : 'incother',
      expense: has(KW_TRANSFER) ? 'finance' : 'other',
      isTransfer: has(KW_TRANSFER),
      isRefund: has(KW_REFUND)
    };
  };

  /* ---------------- 本地朴素贝叶斯 ---------------- */
  var STOP = { '有限公司': 1, '有限': 1, '公司': 1, '科技': 1, '网络': 1, '服务': 1, '支付': 1, '中国': 1, '北京': 1, '上海': 1, '广州': 1, '深圳': 1, '杭州市': 1, '杭州': 1 };
  C.tokenize = function (s) {
    s = String(s == null ? '' : s).toLowerCase();
    var out = [], re = /[\u4e00-\u9fa5]+|[a-z0-9.]+/g, m;
    while ((m = re.exec(s))) {
      var w = m[0];
      if (/^[\u4e00-\u9fa5]+$/.test(w)) {
        if (w.length <= 4) out.push(w);
        for (var i = 0; i < w.length - 1; i++) out.push(w.substr(i, 2));
        if (w.length > 4) { out.push(w.substr(0, 2)); out.push(w.substr(-2)); }
      } else if (w.length > 1) out.push(w);
    }
    return out.filter(function (x) { return !STOP[x]; });
  };

  C.train = function (samples) {
    var m = { cats: {}, total: {}, docCount: {}, vocab: {}, n: 0 };
    samples.forEach(function (s) {
      var text = s.text || ((s.merchant || '') + ' ' + (s.item || '') + ' ' + (s.rawCategory || ''));
      if (!text.trim() || !s.category) return;
      var toks = C.tokenize(text);
      if (!toks.length) return;
      m.n++;
      m.cats[s.category] = m.cats[s.category] || { sub: s.sub || '', tok: {}, count: 0 };
      var bucket = m.cats[s.category];
      bucket.count++;
      if (s.sub) bucket.sub = s.sub;
      toks.forEach(function (tok) {
        bucket.tok[tok] = (bucket.tok[tok] || 0) + 1;
        m.total[tok] = (m.total[tok] || 0) + 1;
        m.vocab[tok] = 1;
      });
    });
    m.V = Object.keys(m.vocab).length || 1;
    return m;
  };

  C.predict = function (model, text) {
    if (!model || !model.n) return null;
    var toks = C.tokenize(text), cats = Object.keys(model.cats);
    if (!toks.length || !cats.length) return null;
    var best = null, i, tok, c;
    for (i = 0; i < cats.length; i++) {
      c = cats[i];
      var b = model.cats[c];
      var score = Math.log((b.count + 0.5) / (model.n + model.n * 0.5));
      var denom = b.count + model.V;
      var hits = 0;
      for (var j = 0; j < toks.length; j++) {
        tok = toks[j];
        var cnt = b.tok[tok] || 0;
        if (cnt) hits++;
        score += Math.log((cnt + 0.4) / denom);
      }
      score = score / Math.sqrt(toks.length || 1);
      if (hits === 0) score -= 4; /* 完全没命中词，强力降权 */
      if (!best || score > best.score) best = { category: c, sub: b.sub, score: score, hits: hits };
    }
    if (!best) return null;
    /* softmax 置信度 */
    var scores = cats.map(function (c) {
      var b = model.cats[c], sc = Math.log((b.count + 0.5) / (model.n + 0.5)), denom = b.count + model.V;
      for (var j = 0; j < toks.length; j++) sc += Math.log(((b.tok[toks[j]] || 0) + 0.4) / denom);
      return sc / Math.sqrt(toks.length || 1);
    });
    var mx = Math.max.apply(null, scores);
    var exps = scores.map(function (s) { return Math.exp(s - mx); });
    var sum = U.sum(exps);
    best.confidence = U.clamp((exps[cats.indexOf(best.category)] / sum), 0, 1);
    if (best.hits === 0) best.confidence = Math.min(best.confidence, 0.4);
    return best;
  };

  C.buildModel = function (db) {
    if (!db) return null;
    var strong = [], weak = [];
    (db.txns || []).forEach(function (t) {
      if (t.excluded || !t.category || t.direction === 'transfer') return;
      var s2 = t.auto && t.auto.source;
      var sample = { text: (t.merchant || '') + ' ' + (t.item || '') + ' ' + (t.rawCategory || ''), category: t.category, sub: t.sub };
      if (s2 === 'memory' || s2 === 'user') strong.push(sample);       /* 人工确认：最高可信 */
      else if (s2 === 'rule') weak.push(sample);                        /* 规则命中：冷启动用 */
    });
    (db.corrections || []).forEach(function (x) {
      strong.push({ text: x.key, category: x.category, sub: x.sub });
    });
    /* 人工样本不足 12 条时，掺入规则样本让模型开箱可用；随着用户纠正增多自动转向个性化 */
    var samples = strong.length >= 12 ? strong : strong.concat(weak.slice(0, 400));
    return samples.length >= 8 ? C.train(samples) : null;
  };

  /* 批量自动分类：只处理未分类或来源为自动的交易 */
  C.autoLabel = function (db, limit) {
    var model = C.buildModel(db);
    var aliasRules = (db.rules || []).reduce(function (m, r) {
      if (r.type === 'alias' && r.merchant) m[r.merchant] = { c: r.category, s: r.sub };
      return m;
    }, {});
    var opt = { corrections: db.corrections || [], model: model, aliasRules: aliasRules };
    var n = 0;
    (db.txns || []).forEach(function (t) {
      var manual = t.auto && (t.auto.source === 'user' || t.auto.source === 'memory');
      if (manual) return;
      if (limit && n >= limit) return;
      var r = C.classify(t, opt);
      t.category = r.category; t.sub = r.sub;
      t.auto = { source: r.source, confidence: r.confidence, at: Date.now() };
      if (r.tags && r.tags.length) t.tags = U.uniq((t.tags || []).concat(r.tags));
      n++;
    });
    return { labeled: n, model: !!model };
  };

  /* ---------------- 内部转账 / 退款 识别 ---------------- */
  C.detectTransfers = function (db) {
    var aliases = (db.settings.ownerAliases || []).slice();
    db.accounts.forEach(function (a) { aliases.push(a.name); if (a.holder) aliases.push(a.holder); });
    var hits = [];
    var list = (db.txns || []).filter(function (t) { return !t.excluded; });
    var byTime = list.slice().sort(function (a, b) { return a.time - b.time; });
    var usedOut = {}, usedIn = {};

    /* A. 关键词判定：转账/提现/充值/还款 且对方是本人账户昵称 */
    list.forEach(function (t) {
      var hay = (t.merchant || '') + (t.item || '') + (t.rawCategory || '');
      var isKw = KW_TRANSFER.some(function (k) { return hay.indexOf(k) >= 0; });
      if (!isKw) return;
      if (t.direction === 'transfer') return;
      var isSelf = aliases.some(function (a) { return a && a.length > 1 && hay.indexOf(a) >= 0; });
      if (isSelf || /零钱通|余额宝|提现|信用卡还款|资金归集/.test(hay)) {
        hits.push({ txn: t, reason: '关键词:' + (isSelf ? '本人账户' : '资金划转'), confidence: 0.9 });
      }
    });
    /* B. 配对判定：账户 A 支出 ↔ 账户 B 收入，金额一致、2 天内 */
    for (var i = 0; i < byTime.length; i++) {
      var a = byTime[i];
      if (a.direction !== 'expense' || usedOut[a.id]) continue;
      for (var j = i + 1; j < byTime.length; j++) {
        var b = byTime[j];
        if (b.time - a.time > 2 * 86400000) break;
        if (b.direction !== 'income' || usedIn[b.id]) continue;
        if (b.accountId === a.accountId) continue;
        if (Math.abs(b.amount - a.amount) > 0.02) continue;
        hits.push({ txn: a, pair: b.id, reason: '跨账户等额配对', confidence: 0.85 });
        hits.push({ txn: b, pair: a.id, reason: '跨账户等额配对', confidence: 0.85 });
        usedOut[a.id] = usedIn[b.id] = 1;
        break;
      }
    }
    return hits;
  };

  C.detectRefunds = function (db) {
    var out = [];
    var list = (db.txns || []).filter(function (t) { return !t.excluded; });
    list.forEach(function (t) {
      var hay = (t.merchant || '') + (t.item || '') + (t.rawCategory || '');
      if (!KW_REFUND.some(function (k) { return hay.indexOf(k) >= 0; })) return;
      if (t.direction !== 'income') return;
      var orig = list.filter(function (x) {
        return x.id !== t.id && x.direction === 'expense' && Math.abs(x.amount - t.amount) < 0.02 &&
          Math.abs(x.time - t.time) < 90 * 86400000 && C.merchantKey(x) === C.merchantKey(t);
      })[0];
      out.push({ txn: t, original: orig ? orig.id : null, confidence: orig ? 0.9 : 0.6 });
    });
    return out;
  };

  /* ---------------- 周期性交易 / 订阅识别 ---------------- */
  C.detectSubscriptions = function (txns, opt) {
    opt = opt || {};
    var groups = {};
    (txns || []).forEach(function (t) {
      if (t.direction !== 'expense' || t.excluded) return;
      var k = C.merchantKey(t);
      (groups[k] = groups[k] || []).push(t);
    });
    var subs = [];
    Object.keys(groups).forEach(function (k) {
      var raw = U.sortBy(groups[k], function (t) { return t.time; });
      /* 同一计费周期内的重复扣款（补扣/重复导入）先折叠，避免污染间隔方差 */
      var g = [];
      raw.forEach(function (x) {
        var last = g[g.length - 1];
        if (!last || (x.time - last.time) > 10 * 86400000) g.push(x);
        else if (x.amount > last.amount) g[g.length - 1] = x;
      });
      if (g.length < 3) return;
      var amounts = g.map(function (t) { return t.amount; });
      var amtMed = U.median(amounts);
      var amtTol = amtMed * (opt.amtTol || 0.25);
      /* 金额需相对稳定，或呈知名订阅涨幅 */
      var stable = amounts.every(function (a) { return Math.abs(a - amtMed) <= amtTol + 0.5; });
      var intervals = [];
      for (var i = 1; i < g.length; i++) intervals.push((g[i].time - g[i - 1].time) / 86400000);
      var medI = U.median(intervals);
      var cv = medI > 0 ? U.stdev(intervals) / medI : 9;
      var cycle = null;
      if (medI >= 5 && medI <= 9) cycle = 'weekly';
      else if (medI >= 25 && medI <= 35) cycle = 'monthly';
      else if (medI >= 85 && medI <= 98) cycle = 'quarterly';
      else if (medI >= 330 && medI <= 400) cycle = 'yearly';
      if (!cycle || cv > (opt.cvTol || 0.35)) return;
      if (!stable && cycle !== 'monthly') return;
      var last = g[g.length - 1];
      var next = last.time + medI * 86400000;
      subs.push({
        key: k, merchant: C.aliasOf(C.normalizeMerchant(last.merchant) || last.merchant),
        amount: U.round2(amtMed), cycle: cycle, intervalDays: Math.round(medI),
        count: g.length, category: last.category, sub: last.sub,
        accountId: last.accountId, lastDate: last.time, nextDate: next,
        confidence: U.clamp(1 - cv, 0, 1) * (stable ? 1 : 0.8),
        months: Math.round((last.time - g[0].time) / 86400000 / 30.4) + 1
      });
    });
    return U.sortBy(subs, function (s) { return s.confidence; }, true);
  };

  /* ---------------- 异常检测 ---------------- */
  C.detectAnomalies = function (txns, opt) {
    opt = opt || {};
    var list = (txns || []).filter(function (t) { return !t.excluded && t.direction !== 'transfer'; });
    var byCat = U.groupBy(list, function (t) { return t.category || 'other'; });
    var out = [];
    Object.keys(byCat).forEach(function (c) {
      var g = byCat[c];
      if (g.length < 6) return;
      var amounts = g.map(function (t) { return t.amount; });
      var med = U.median(amounts), mad = U.mad(amounts);
      var threshold = Math.max(med + 5 * (mad || med * 0.5), med * 4, 100);
      g.forEach(function (t) {
        if (t.amount > threshold) out.push({ txn: t, type: 'big', reason: '远超该类日常水平(' + U.money(med) + ')', score: t.amount / (med || 1) });
      });
    });
    /* 同一商户同额同方向 24h 内多笔 -> 重复扣款嫌疑 */
    var byKey = U.groupBy(list, function (t) { return C.merchantKey(t) + '|' + t.amount + '|' + t.direction; });
    Object.keys(byKey).forEach(function (k) {
      var g = U.sortBy(byKey[k], function (t) { return t.time; });
      for (var i = 1; i < g.length; i++) {
        if (g[i].time - g[i - 1].time < 24 * 3600000) {
          out.push({ txn: g[i], type: 'duplicate', reason: '与上一笔同商户同金额，疑似重复扣款', score: 2 });
        }
      }
    });
    /* 深夜大额 */
    list.forEach(function (t) {
      var h = new Date(t.time).getHours();
      if (t.amount >= 500 && (h >= 1 && h <= 5)) out.push({ txn: t, type: 'night', reason: '凌晨大额支出', score: 1.5 });
    });
    return U.sortBy(out, function (o) { return o.txn.time; }, true);
  };

  /* ---------------- 去重 ---------------- */
  C.fingerprint = function (t) {
    return [t.accountId, Math.round(t.time / 60000), U.round2(t.amount), t.direction, C.merchantKey(t)].join('|');
  };
  C.findDuplicate = function (t, all) {
    if (t.orderNo) {
      var hit = all.filter(function (x) { return x.orderNo && x.orderNo === t.orderNo; })[0];
      if (hit) return { hit: hit, kind: 'orderNo' };
    }
    var fp = C.fingerprint(t);
    var hit2 = all.filter(function (x) { return C.fingerprint(x) === fp; })[0];
    if (hit2) return { hit: hit2, kind: 'fuzzy' };
    return null;
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>/* ==== js/parsers.js ==== */
/* FlowAtlas · 账单导入与解析引擎
   CSV / Excel(.xlsx 原生解压) / 截图OCR / 手动补录 -> 结构化交易 */
(function (root) {
  'use strict';
  var FA = root.FA, U = FA.util;
  var P = (FA.parser = {});

  /* ---------------- CSV ---------------- */
  P.parseCSV = function (text, delim) {
    text = String(text).replace(/^\uFEFF/, '');
    var rows = [], row = [], field = '', inQ = false, i = 0, ch, d = delim;
    var candidates = [',', '\t', ';', '|'];
    if (!d) {
      var head = text.slice(0, 4000);
      var best = 0, bestCount = -1;
      candidates.forEach(function (c) {
        var n = (head.split('\n')[0] || '').split(c).length;
        if (n > bestCount) { bestCount = n; best = c; }
      });
      d = bestCount > 1 ? best : ',';
    }
    while (i < text.length) {
      ch = text[i];
      if (inQ) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQ = false; i++; continue;
        }
        field += ch; i++; continue;
      }
      if (ch === '"') { inQ = true; i++; continue; }
      if (ch === d) { row.push(field); field = ''; i++; continue; }
      if (ch === '\r') { i++; continue; }
      if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += ch; i++;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
  };

  /* ---------------- 表头识别 ---------------- */
  var FIELD_ALIASES = {
    time: ['交易时间', '交易创建时间', '付款时间', '交易日期', '时间', '记账日期', '发生时间', '交易发生时间'],
    merchant: ['交易对方', '对方', '商户名称', '交易对象', '收款方', '付款方', '对方户名'],
    item: ['商品', '商品说明', '商品名称', '交易内容', '摘要', '用途', '备注说明'],
    direction: ['收/支', '收支', '收/支类型', '资金方向', '收支类型', '借贷标志'],
    amount: ['金额(元)', '金额', '发生金额', '交易金额', '金额（元）', '收支金额'],
    payMethod: ['支付方式', '收/付款方式', '付款方式', '结算方式', '账户'],
    status: ['当前状态', '交易状态', '订单状态', '状态'],
    orderNo: ['交易单号', '交易订单号', '订单号', '流水号', '交易流水号'],
    merchantNo: ['商户单号', '商家订单号', '商户订单号'],
    rawCategory: ['交易分类', '交易类型', '类型', '分类'],
    note: ['备注', '说明', '附言', '摘要备注'],
    currency: ['币种', '货币'],
    balance: ['余额', '账户余额', '可用余额']
  };
  var HEADER_HINTS = ['交易时间', '金额', '收/支', '交易对方', '商品', '交易单号', '交易订单号', '商户单号', '收支', '交易状态', '当前状态', '交易类型'];

  P.sniffHeader = function (rows) {
    var best = { index: -1, score: 0, map: {} };

  /* ---------------- 来源识别 ---------------- */

  };

    alipay: { name: '支付宝', icon: '💙', color: '#1677FF', accountType: 'alipay' },
    bank: { name: '银行流水', icon: '💳', color: '#E8474B', accountType: 'bank' },

  /* ---------------- 金额 / 方向 ---------------- */
  P.parseAmount = function (v) {

  P.parseDirection = function (raw, amount, rawCategory) {

    }

    if (/收入|收款|转入|贷/.test(s) && !/支出/.test(s)) return 'income';

  P.STATUS = {
    ok: /交易成功|支付成功|已收钱|已存入零钱|朋友已收钱|已到账|成功|完成|已转账|充值成功|提现已到账|已退款成功|退款成功|部分退款/,
    bad: /交易关闭|已关闭|已撤销|失败|未支付|取消/,

  P.parseStatus = function (raw) {

  };
  P.payMethodToAccountHint = function (pay) {

    if (/余额|支付宝|花呗|余额宝/.test(s)) return 'alipay';
    if (/银行|储蓄卡|借记卡|信用卡|银联|一卡通|工商|建设|招商|农业|中国银行|交通银行|邮储|中信|民生|兴业|光大|浦发|平安银行/.test(s)) return 'bank';

  /* ---------------- 行 -> 交易 ---------------- */

      var t = {
        id: U.uid('tx'), time: time, amount: U.round2(Math.abs(amt)), direction: dir,
        accountId: ctx.accountId || null, merchant: merchant, item: get('item'),
        rawCategory: rawCat, payMethod: get('payMethod'), status: status,
        orderNo: get('orderNo') || '', merchantNo: get('merchantNo') || '',

        tags: rawCat ? [rawCat] : [], excluded: false, category: '', sub: '',

      if (dir === 'transfer') t.excluded = true;
      if (status === 'refunded') t.tags.push('退款');
      out.push(t);
    }
    return { txns: out, skipped: skipped };
  };

  /* ---------------- 通用表格入口 ---------------- */
  P.parseTable = function (rows, ctx) {
    ctx = ctx || {};

    if (sheet.rowIndex < 0) {
      return { ok: false, txns: [], skipped: [], error: '未能自动识别表头（需要包含「交易时间」和「金额」列）。请检查文件或使用手动补录。', header: null };

      headerNames: rows[sheet.rowIndex].map(function (c) { return String(c).replace(/\s/g, ''); })

  /* ---------------- XLSX（原生 ZIP + DecompressionStream） ---------------- */

          var vM = body.match(/<v[^>]*>([\s\S]*?)<\/v>/);

  P.parseXlsx = function (buffer) {
    return P.unzip(buffer).then(function (files) {

  /* ---------------- 统一文件读取 ---------------- */
  P.readFile = function (file) {

      var name = (file.name || '').toLowerCase();
      if (/\.xlsx?$/.test(name)) {
        return P.parseXlsx(buf).then(function (sheets) {
          var best = sheets.reduce(function (a, b) { return (b.rows.length > (a ? a.rows.length : 0)) ? b : a; }, null);
          if (!best) throw new Error('Excel 中没有可读取的工作表');
          return { kind: 'xlsx', sheets: sheets, rows: best.rows, sheetName: best.name, encoding: 'xlsx' };
        });

  /* ---------------- 导入流水线 ---------------- */

            file: f.name, size: f.size, encoding: rd.encoding, kind: rd.kind, source: source,
            sheetName: rd.sheetName

  };

  /* ---------------- 截图 OCR 通道 ---------------- */
  /* 优先使用本地 Tesseract（若用户放入离线包），否则降级为「图像 + 手工快录」 */

    });
  };
  /* 从票据文字里抽取候选金额/商户/时间 —— 纯函数，可单测 */
  P.parseReceiptText = function (text) {
    var lines = String(text || '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
    var cands = [];
    var amountRe = /(?:¥|￥|RMB|人民币)?\s*(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)\s*元?/g;
    var keyLine = /合计|实付|应付|总计|金额|支付|付款|订单金额|优惠后/;
    var strong = [], weak = [];

      var m, vals = [];
      while ((m = amountRe.exec(ln))) {
        var v = parseFloat(m[1].replace(/,/g, ''));

    var pool = strong.length ? strong : weak;
    var seen = {};
    pool.forEach(function (x) {
      if (seen[x.amount]) return;
      seen[x.amount] = 1;
      cands.push({ amount: x.amount, evidence: x.line, confidence: strong.length ? 0.85 : 0.4 });

    var date = null;

      var dm = lines[i].match(/(20\d{2})[-/年.](\d{1,2})[-/月.](\d{1,2})/);

        var dm2 = lines[i].match(/(\d{1,2})[-/月](\d{1,2})\s*日?\s*(\d{1,2}:\d{2})?/);

    var skipWords = /合计|实付|应付|总计|金额|支付方式|订单号|商户单号|欢迎|谢谢|小票|发票|电子|时间|收银|服务员|台号|打印/;
    for (var j = 0; j < Math.min(lines.length, 6); j++) {
      var ln2 = lines[j];

      return { amount: c.amount, merchant: merchant, time: date, payMethod: payMatch, orderNo: orderMatch, confidence: c.confidence, evidence: c.evidence };
    });
  };

  /* ---------------- 手动补录 ---------------- */
  P.manualTxn = function (o) {
    return {
      id: U.uid('tx'), time: o.time || Date.now(), amount: U.round2(Math.abs(U.num(o.amount))),
      direction: o.direction || 'expense', accountId: o.accountId || null,
      merchant: o.merchant || '手动记录', item: o.item || '', rawCategory: '',
      payMethod: o.payMethod || '', status: 'success', orderNo: o.orderNo || '',
      merchantNo: '', note: o.note || '', currency: 'CNY', source: 'manual', sourceFile: '',

<script>/* ==== js/charts.js ==== */
/* FlowAtlas · 图表库（原生 Canvas，无依赖，可导出高清图） */
(function (root) {

  var FA = root.FA, U = FA.util;

  var PALETTE = ['#FF6B6B', '#4D96FF', '#F473B9', '#FFB020', '#2ED3B7', '#8E7CFF', '#FF8A3D', '#3EC1D3', '#22C55E', '#EAB308', '#EF4444', '#6C5CE7', '#14B8A6', '#A0C15A'];

    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);

  /* ---------- 环形图 ---------- */
  Ch.donut = function (canvas, opt) {

    var total = U.sum(data, function (d) { return d.value; });

      g.beginPath();

      g.strokeStyle = d.color || Ch.color(i);
      g.lineWidth = R - r;
      g.lineCap = 'butt';
      g.stroke();
      a0 += ang;
    });
    if (opt.center) {
      g.textAlign = 'center';
      Ch.font(g, opt.centerValueSize || 20, 700);
      g.fillStyle = Ch.textColor();
      g.fillText(opt.center.value, cx, cy + (opt.centerLabel ? 2 : 7));
      if (opt.centerLabel) {
        Ch.font(g, 11, 500); g.fillStyle = Ch.subColor();
        g.fillText(opt.center.label, cx, cy + 18);
      }
    }
  };

  /* ---------- 纵向柱状 ---------- */
  Ch.bars = function (canvas, opt) {
    var s = Ch.setup(canvas, opt), g = s.g, w = s.w, h = s.h;
    var labels = opt.labels || [], values = opt.values || [];
    var padB = 20, padT = opt.padT == null ? 18 : opt.padT;
    var max = Math.max.apply(null, values.concat([1]));
    var n = values.length || 1;
    var bw = (w - 8) / n, inner = Math.min(bw * 0.58, 26);
    g.textAlign = 'center';
    for (var i = 0; i < n; i++) {
      var v = values[i] || 0;
      var bh = Math.max(2, ((h - padB - padT) * v) / max);
      var x = 4 + i * bw + (bw - inner) / 2, y = h - padB - bh;
      var col = (opt.colors && opt.colors[i]) || Ch.color(i);
      var grad = g.createLinearGradient(0, y, 0, h - padB);
      grad.addColorStop(0, col); grad.addColorStop(1, col + '66');
      g.fillStyle = grad;
      Ch.roundRect(g, x, y, inner, bh, Math.min(6, inner / 2)); g.fill();
      if (opt.showValue && v > 0) {
        Ch.font(g, 9, 600); g.fillStyle = Ch.subColor();
        g.fillText(U.moneyShort(v), x + inner / 2, y - 4);
      }
      Ch.font(g, 10, 500); g.fillStyle = Ch.subColor();
      g.fillText(labels[i] || '', x + inner / 2, h - 6);
    }
  };

  /* ---------- 折线 / 面积 ---------- */
  Ch.line = function (canvas, opt) {
    var s = Ch.setup(canvas, opt), g = s.g, w = s.w, h = s.h;
    var labels = opt.labels || [], series = opt.series || [];
    var padL = opt.padL == null ? 34 : opt.padL, padR = 6, padT = 10, padB = 20;
    var all = [];
    series.forEach(function (se) { all = all.concat(se.data || []); });
    var max = Math.max.apply(null, all.concat([1])) * 1.15, min = 0;
    var iw = w - padL - padR, ih = h - padT - padB;
    var X = function (i) { return padL + (labels.length <= 1 ? iw / 2 : (iw * i) / (labels.length - 1)); };
    var Y = function (v) { return padT + ih - ((v - min) / (max - min || 1)) * ih; };
    g.strokeStyle = 'rgba(148,163,184,.18)'; g.lineWidth = 1;
    g.textAlign = 'right';
    for (var k = 0; k <= 3; k++) {
      var yv = min + ((max - min) * k) / 3, y = Y(yv);
      g.beginPath(); g.moveTo(padL, y); g.lineTo(w - padR, y); g.stroke();
      Ch.font(g, 9, 500); g.fillStyle = Ch.subColor();
      g.fillText(U.moneyShort(yv), padL - 5, y + 3);
    }
    series.forEach(function (se, si) {
      var d = se.data || [], col = se.color || Ch.color(si);
      if (se.fill !== false) {
        var grad = g.createLinearGradient(0, padT, 0, padT + ih);
        grad.addColorStop(0, col + '55'); grad.addColorStop(1, col + '00');
        g.beginPath();
        d.forEach(function (v, i) { i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)); });
        g.lineTo(X(d.length - 1), padT + ih); g.lineTo(X(0), padT + ih); g.closePath();
        g.fillStyle = grad; g.fill();
      }
      g.beginPath();
      d.forEach(function (v, i) { i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)); });
      g.strokeStyle = col; g.lineWidth = 2.2; g.lineJoin = 'round'; g.stroke();
      d.forEach(function (v, i) {
        g.beginPath(); g.arc(X(i), Y(v), 2.6, 0, 7); g.fillStyle = '#fff'; g.fill();
        g.strokeStyle = col; g.lineWidth = 1.8; g.stroke();
      });
    });
    g.textAlign = 'center';
    labels.forEach(function (lb, i) {
      Ch.font(g, 9, 500); g.fillStyle = Ch.subColor();
      g.fillText(lb, X(i), h - 6);
    });
  };

  /* ---------- 横向排行 ---------- */
  Ch.rank = function (canvas, opt) {
    var rows = opt.data || [];
    var rowH = opt.rowH || 34;
    var s = Ch.setup(canvas, Object.assign({}, opt, { h: opt.h || rows.length * rowH + 6 }));
    var g = s.g, w = s.w;
    var max = Math.max.apply(null, rows.map(function (r) { return r.value; }).concat([1]));
    rows.forEach(function (r, i) {
      var y = i * rowH + 4;
      var bw = (w - 4) * (r.value / max);
      g.fillStyle = 'rgba(148,163,184,.14)';
      Ch.roundRect(g, 2, y, w - 4, rowH - 12, (rowH - 12) / 2); g.fill();
      var col = r.color || Ch.color(i);
      var grad = g.createLinearGradient(0, 0, w, 0);
      grad.addColorStop(0, col + 'cc'); grad.addColorStop(1, col);
      g.fillStyle = grad;
      Ch.roundRect(g, 2, y, Math.max(bw, 8), rowH - 12, (rowH - 12) / 2); g.fill();
      Ch.font(g, 12, 600); g.fillStyle = '#fff'; g.textAlign = 'left';
      g.fillText((r.icon ? r.icon + ' ' : '') + r.name, 12, y + rowH - 17);
      Ch.font(g, 12, 700); g.textAlign = 'right';
      g.fillStyle = 'rgba(255,255,255,.96)';
      g.fillText(U.money(r.value), w - 10, y + rowH - 17);
    });
    return s.h;
  };

  /* ---------- 日历热力图 ---------- */
  Ch.heat = function (canvas, opt) {
    var days = opt.days || [];   /* [{date:'2024-03-01', value:n}] */
    var s = Ch.setup(canvas, opt), g = s.g, w = s.w, h = s.h;
    if (!days.length) return;
    var first = new Date(U.parseDate(days[0].date + ' 00:00'));
    var lead = first.getDay();
    var cols = Math.ceil((lead + days.length) / 7);
    var gap = 2;
    var cell = Math.min((w - 2) / cols - gap, (h - 12) / 7 - gap);
    var max = Math.max.apply(null, days.map(function (d) { return d.value; }).concat([1]));
    var startX = (w - (cols * (cell + gap) - gap)) / 2;
    days.forEach(function (d, i) {
      var idx = lead + i, col = Math.floor(idx / 7), row = idx % 7;
      var x = startX + col * (cell + gap), y = 8 + row * (cell + gap);
      var t = d.value / max;
      var col2 = t <= 0 ? 'rgba(148,163,184,.12)' : 'hsl(' + (170 - t * 170) + ',85%,' + (88 - t * 42) + '%)';
      g.fillStyle = col2;
      Ch.roundRect(g, x, y, cell, cell, Math.min(3, cell / 3)); g.fill();
    });
  };

  /* ---------- 预算进度环 ---------- */
  Ch.ring = function (canvas, opt) {
    var s = Ch.setup(canvas, opt), g = s.g, w = s.w, h = s.h;
    var pct = U.clamp(opt.value || 0, 0, 1.5), cx = w / 2, cy = h / 2;
    var R = Math.min(w, h) / 2 - 5, lw = opt.lw || 7;
    g.lineCap = 'round';
    g.beginPath(); g.arc(cx, cy, R - lw / 2, 0, Math.PI * 2);
    g.strokeStyle = 'rgba(148,163,184,.2)'; g.lineWidth = lw; g.stroke();
    var col = opt.color || (pct > 1 ? '#EF4444' : pct > 0.8 ? '#F59E0B' : '#22C55E');
    g.beginPath();
    g.arc(cx, cy, R - lw / 2, -Math.PI / 2, -Math.PI / 2 + Math.min(pct, 1) * Math.PI * 2);
    g.strokeStyle = col; g.lineWidth = lw; g.stroke();
    g.textAlign = 'center';
    Ch.font(g, opt.fontSize || 13, 700); g.fillStyle = Ch.textColor();
    g.fillText(opt.label != null ? opt.label : Math.round(pct * 100) + '%', cx, cy + 5);
  };

  /* ---------- 走势双柱（收入/支出对比） ---------- */
  Ch.dualBars = function (canvas, opt) {
    var s = Ch.setup(canvas, opt), g = s.g, w = s.w, h = s.h;
    var labels = opt.labels || [], a = opt.a || [], b = opt.b || [];
    var padB = 20, padT = 12, iw = w - 8, ih = h - padB - padT;
    var max = Math.max.apply(null, a.concat(b).concat([1]));
    var n = labels.length || 1, bw = iw / n;
    labels.forEach(function (lb, i) {
      var x0 = 4 + i * bw + bw * 0.18, bwid = bw * 0.28;
      var ha = (ih * (a[i] || 0)) / max, hb = (ih * (b[i] || 0)) / max;
      g.fillStyle = opt.colorA || '#22C55E';
      Ch.roundRect(g, x0, padT + ih - ha, bwid, Math.max(ha, 1.5), 3); g.fill();
      g.fillStyle = opt.colorB || '#FF6B6B';
      Ch.roundRect(g, x0 + bwid + 2, padT + ih - hb, bwid, Math.max(hb, 1.5), 3); g.fill();
      g.textAlign = 'center'; Ch.font(g, 9.5, 500); g.fillStyle = Ch.subColor();
      g.fillText(lb, x0 + bwid + 1, h - 6);
    });
    g.textAlign = 'right';
    for (var k = 0; k <= 2; k++) {
      var yv = (max * k) / 2, y = padT + ih - (ih * k) / 2;
      g.strokeStyle = 'rgba(148,163,184,.16)'; g.beginPath(); g.moveTo(4, y); g.lineTo(w, y); g.stroke();
      Ch.font(g, 9, 500); g.fillStyle = Ch.subColor(); g.fillText(U.moneyShort(yv), w - 2, y - 3);
    }
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>/* ==== js/report.js ==== */
/* FlowAtlas · 月度报告：统计建模 + 洞察生成 + 分享长图导出 */
(function (root) {
  'use strict';
  var FA = root.FA, U = FA.util;
  var Rp = (FA.report = {});

  Rp.availableMonths = function () {
    var S = FA.store, set = {};
    S.db.txns.forEach(function (t) { set[U.ym(t.time)] = 1; });
    var arr = Object.keys(set).sort().reverse();
    var cur = U.ym(Date.now());
    if (arr.indexOf(cur) < 0) arr.unshift(cur);
    return arr;
  };

  function monthBudgetExec(ym) {
    var S = FA.store;
    return S.db.budgets.map(function (b) {
      var cats = b.categories && b.categories.length ? b.categories : null;
      var list = S.filterTxns({ ym: ym, direction: 'expense' });
      var scope = cats ? list.filter(function (t) { return cats.indexOf(t.category) >= 0; }) : list;
      var spent = U.sum(scope, function (t) { return t.amount; });
      var days = new Date(U.monthRange(ym).end - 1).getDate();
      var now = new Date();
      var elapsed = U.ym(now) === ym ? now.getDate() : days;
      var expected = (b.amount * elapsed) / days;
      return {
        id: b.id, name: b.name, icon: b.icon || '🎯', color: b.color || '#4D96FF',
        amount: b.amount, spent: U.round2(spent), left: U.round2(b.amount - spent),
        pct: b.amount > 0 ? spent / b.amount : 0, pace: expected > 0 ? spent / expected : 0,
        dailyAllowance: U.round2(Math.max(0, (b.amount - spent) / Math.max(1, days - elapsed + 1))),
        categories: cats, period: b.period || 'monthly'
      };
    });
  }

  Rp.build = function (ym) {
    var S = FA.store;
    ym = ym || U.ym(Date.now());
    var cur = S.summary({ ym: ym });
    var prevYm = U.addMonths(ym, -1);
    var prev = S.summary({ ym: prevYm });
    var cats = S.catBreakdown({ ym: ym }, 'expense');
    var incCats = S.catBreakdown({ ym: ym }, 'income');
    var byMerchant = {};
    cur.list.forEach(function (t) {
      if (t.direction !== 'expense') return;
      var k = FA.cat.aliasOf(FA.cat.normalizeMerchant(t.merchant)) || t.merchant;
      byMerchant[k] = byMerchant[k] || { name: k, total: 0, count: 0, category: t.category, icon: S.cat(t.category).icon, color: S.cat(t.category).color };
      byMerchant[k].total += t.amount; byMerchant[k].count++;
    });
    var top = U.sortBy(Object.keys(byMerchant).map(function (k) { return byMerchant[k]; }), function (x) { return x.total; }, true);
    top.forEach(function (x) { x.total = U.round2(x.total); });

    var range = U.monthRange(ym), daysInMonth = new Date(range.end - 1).getDate();
    var perDay = [], heat = [];
    for (var d = 1; d <= daysInMonth; d++) {
      var day = new Date(range.start); day.setDate(d);
      var ts = day.getTime(), t2 = ts + 86400000;
      var dayList = cur.list.filter(function (t) { return t.time >= ts && t.time < t2; });
      var exp = U.sum(dayList.filter(function (t) { return t.direction === 'expense'; }), function (t) { return t.amount; });
      var inc = U.sum(dayList.filter(function (t) { return t.direction === 'income'; }), function (t) { return t.amount; });
      perDay.push({ day: d, date: U.ymd(day), expense: U.round2(exp), income: U.round2(inc), weekend: day.getDay() === 0 || day.getDay() === 6 });
      heat.push({ date: U.ymd(day), value: exp });
    }
    var trend = [];
    for (var i = 5; i >= 0; i--) {
      var m = U.addMonths(ym, -i), s2 = S.summary({ ym: m });
      trend.push({ ym: m, label: (+m.split('-')[1]) + '月', income: s2.income, expense: s2.expense, net: s2.net });
    }
    var budgets = monthBudgetExec(ym);
    var anomalies = FA.cat.detectAnomalies(cur.list, {});
    var nw = S.netWorth();
    var subsMonthly = 0;
    S.db.subs.forEach(function (s2) {
      if (s2.status === 'cancelled') return;
      var f = s2.cycle === 'yearly' ? 1 / 12 : s2.cycle === 'quarterly' ? 1 / 3 : s2.cycle === 'weekly' ? 4.33 : 1;
      subsMonthly += (s2.amount || 0) * f;
    });
    var dueDebts = S.db.debts.filter(function (x) { return x.status !== 'closed'; });
    var activeDays = perDay.filter(function (p) { return p.expense > 0; }).length;

    var r = {
      ym: ym, label: U.monthLabel(ym), generatedAt: Date.now(),
      income: cur.income, expense: cur.expense, net: cur.net, count: cur.count,
      savingsRate: cur.savingsRate,
      prevYm: prevYm, prev: { income: prev.income, expense: prev.expense, net: prev.net },
      deltaExpense: prev.expense > 0 ? (cur.expense - prev.expense) / prev.expense : null,
      deltaIncome: prev.income > 0 ? (cur.income - prev.income) / prev.income : null,
      cats: cats, incomeCats: incCats, topMerchants: top.slice(0, 10),
      perDay: perDay, heat: heat, trend: trend, budgets: budgets, anomalies: anomalies,
      assets: nw.assets, debts: nw.debts, netWorth: nw.net,
      avgDaily: U.round2(cur.expense / Math.max(1, daysInMonth)),
      activeDays: activeDays, daysInMonth: daysInMonth,
      biggest: U.sortBy(cur.list.filter(function (t) { return t.direction === 'expense'; }), function (t) { return t.amount; }, true).slice(0, 5),
      subsMonthly: U.round2(subsMonthly),
      subCount: S.db.subs.filter(function (x) { return x.status !== 'cancelled'; }).length,
      debtCount: dueDebts.length,
      debtBalance: U.round2(U.sum(dueDebts, function (x) { return x.balance || 0; })),
      debtMonthly: U.round2(U.sum(dueDebts, function (x) { return x.minPayment || 0; })),
      upcomingDebts: U.sortBy(dueDebts.filter(function (x) { return x.dueDay; }), function (x) { return x.dueDay; }),
      goals: S.db.goals.map(function (g) {
        var pct = g.targetAmount > 0 ? (g.saved || 0) / g.targetAmount : 0;
        return { id: g.id, name: g.name, icon: g.icon, target: g.targetAmount, saved: g.saved || 0, pct: pct, deadline: g.deadline, remain: U.round2(Math.max(0, g.targetAmount - (g.saved || 0))) };
      }),
      accounts: S.db.accounts.map(function (a) { return { id: a.id, name: a.name, icon: a.icon, color: a.color, balance: S.accountBalance(a) }; })
    };
    r.insights = Rp.insights(r);
    return r;
  };

  /* ---------------- 自动洞察 ---------------- */
  Rp.insights = function (r) {
    var out = [];
    if (r.deltaExpense != null) {
      var d = Math.round(Math.abs(r.deltaExpense) * 100);
      if (r.deltaExpense > 0.1) out.push({ icon: '📈', tone: 'warn', text: '本月支出比上月增加 ' + d + '%，多花了 ' + U.money(r.expense - r.prev.expense) });
      else if (r.deltaExpense < -0.1) out.push({ icon: '📉', tone: 'good', text: '本月支出比上月减少 ' + d + '%，省下 ' + U.money(r.prev.expense - r.expense) });
      else out.push({ icon: '⚖️', tone: 'flat', text: '支出与上月基本持平（波动 ' + d + '%）' });
    }
    if (r.savingsRate > 0) {
      out.push({ icon: '🐷', tone: r.savingsRate > 0.3 ? 'good' : 'flat', text: '储蓄率 ' + Math.round(r.savingsRate * 100) + '%，本月结余 ' + U.money(r.net) });
    } else if (r.income > 0) {
      out.push({ icon: '🚨', tone: 'warn', text: '本月入不敷出，赤字 ' + U.money(-r.net) });
    }
    if (r.cats.length) {
      var top = r.cats[0], share = r.expense > 0 ? top.total / r.expense : 0;
      out.push({ icon: top.icon, tone: share > 0.4 ? 'warn' : 'flat', text: top.name + ' 占比最高 ' + Math.round(share * 100) + '%，共 ' + U.money(top.total) });
      /* 增速最快的分类 */
      var prevCats = FA.store.catBreakdown({ ym: r.prevYm }, 'expense'), m = {};
      prevCats.forEach(function (c) { m[c.id] = c.total; });
      var growth = r.cats.map(function (c) { return { c: c, g: (c.total - (m[c.id] || 0)) / ((m[c.id] || 0) || Math.max(c.total, 1)) }; })
        .filter(function (x) { return x.c.total > 100 && (m[x.c.id] || 0) > 50; }).sort(function (a, b) { return b.g - a.g; })[0];
      if (growth && growth.g > 0.5) out.push({ icon: '🔺', tone: 'warn', text: growth.c.name + ' 比上月增长 ' + Math.round(growth.g * 100) + '%，注意控制' });
    }
    r.budgets.forEach(function (b) {
      if (b.pct > 1) out.push({ icon: '💥', tone: 'warn', text: '「' + b.name + '」已超预算 ' + U.money(b.spent - b.amount) + '（' + Math.round(b.pct * 100) + '%）' });
      else if (b.pct > 0.8) out.push({ icon: '⚠️', tone: 'warn', text: '「' + b.name + '」预算已用 ' + Math.round(b.pct * 100) + '%，剩余 ' + U.money(b.left) });
    });
    if (r.subsMonthly > 0) out.push({ icon: '🔁', tone: 'flat', text: '订阅固定支出约 ' + U.money(r.subsMonthly) + '/月，全年 ' + U.money(r.subsMonthly * 12) });
    if (r.anomalies.length) out.push({ icon: '🔍', tone: 'warn', text: '发现 ' + r.anomalies.length + ' 笔异常交易，最大一笔 ' + U.money(r.anomalies[0].txn ? r.anomalies[0].txn.amount : (r.biggest[0] ? r.biggest[0].amount : 0)) });
    if (r.topMerchants.length && r.expense > 0) {
      var t0 = r.topMerchants[0];
      out.push({ icon: '🏪', tone: 'flat', text: '最常消费的商户是「' + t0.name + '」，共 ' + t0.count + ' 笔 ' + U.money(t0.total) });
    }
    if (r.netWorth < 0) out.push({ icon: '⚠️', tone: 'warn', text: '净资产为负（' + U.money(r.netWorth) + '），债务 ' + U.money(r.debts) });
    else if (r.assets > 0) out.push({ icon: '🏦', tone: 'good', text: '净资产 ' + U.money(r.netWorth) + '（资产 ' + U.money(r.assets) + ' / 负债 ' + U.money(r.debts) + '）' });
    return out;
  };

  /* ---------------- 导出 CSV ---------------- */
  Rp.toCSV = function (ym) {
    var S = FA.store;
    var list = S.filterTxns({ ym: ym, includeExcluded: true }).sort(function (a, b) { return a.time - b.time; });
    var head = ['时间', '类型', '账户', '分类', '子分类', '商户', '商品', '金额', '方向', '支付方式', '状态', '交易单号', '备注', '标签'];
    var dirCN = { expense: '支出', income: '收入', transfer: '转账' };
    var lines = [head.join(',')];
    list.forEach(function (t) {
      var acc = S.account(t.accountId);
      var row = [U.fmtDate(t.time, 'full'), t.source, acc.name, S.catName(t.category), t.sub || '', t.merchant, t.item, t.amount, dirCN[t.direction] || '', t.payMethod, t.status, t.orderNo, t.note, (t.tags || []).join(' ')];
      lines.push(row.map(function (c) { var s = String(c == null ? '' : c); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(','));
    });
    return '\uFEFF' + lines.join('\r\n');
  };

  /* ---------------- 分享长图 ---------------- */
  function rrect(g, x, y, w, h, r) { FA.chart.roundRect(g, x, y, w, h, r); }
  function F(g, size, weight) { FA.chart.font(g, size, weight); }

  Rp.shareCard = function (r) {
    var W = 1080, H = 1720;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var g = c.getContext('2d');
    /* 背景 */
    var bg = g.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#0B1220'); bg.addColorStop(0.5, '#131C31'); bg.addColorStop(1, '#0E1626');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    var blobs = [[120, 120, 360, '#FF6B6B'], [W - 90, 260, 320, '#4D96FF'], [W - 160, H - 300, 380, '#8E7CFF'], [180, H - 200, 300, '#2ED3B7']];

  /* 底部动作菜单 */
  UI.actions = function (title, items) {
    var body = UI.h('div.action-list');
    items.forEach(function (it) {
      if (!it) return;
      body.appendChild(UI.h('button.action-item' + (it.danger ? '.danger' : ''), {
        onclick: function () { close(); setTimeout(function () { it.onTap && it.onTap(); }, 120); }
      }, UI.h('span.action-icon', {}, it.icon ? UI.icon(it.icon) : it.emoji || ''), UI.h('span', {}, it.label),
        it.hint ? UI.h('span.action-hint', {}, it.hint) : null));
    });
    var s = UI.sheet({ title: title, body: body });
    var close = s.close;
    return s;
  };

  /* ---------------- 长按 ---------------- */
  UI.longPress = function (el, fn, ms) {
    var timer = null, moved = false;
    var start = function () { moved = false; timer = setTimeout(function () { if (!moved) { U.vibrate(12); fn(); } }, ms || 480); };
    var cancel = function () { clearTimeout(timer); };
    el.addEventListener('touchstart', start, { passive: true });
    el.addEventListener('touchmove', function () { moved = true; cancel(); }, { passive: true });
    el.addEventListener('touchend', cancel);
    el.addEventListener('touchcancel', cancel);
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', cancel);
    el.addEventListener('mouseleave', cancel);
  };

  /* ---------------- 路由 ---------------- */
  var routes = {}, current = null;
  UI.register = function (name, def) { routes[name] = def; };
  function parseHash() {
    var m = String(location.hash || '').replace(/^#\/?/, '');
    var qi = m.indexOf('?'), params = {};
    var name = qi >= 0 ? m.slice(0, qi) : m;
    var qs = qi >= 0 ? m.slice(qi + 1) : '';
    qs.split('&').filter(Boolean).forEach(function (kv) {
      var i = kv.indexOf('=');
      params[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
    });
    return { name: name || 'home', params: params };
  }
  UI.go = function (name, params, replace) {
    var qs = Object.keys(params || {}).filter(function (k) { return params[k] != null && params[k] !== ''; })
      .map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
    var hash = '#/' + name + (qs ? '?' + qs : '');
    if (location.hash === hash) { UI.render(); return; }
    if (replace) location.replace(hash); else location.hash = hash;
  };
  UI.back = function () { if (history.length > 1) history.back(); else UI.go('home'); };

  UI.render = function () {
    var r = parseHash(), def = routes[r.name] || routes.home;
    if (current && current.unmount) { try { current.unmount(); } catch (e) { } }
    var view = UI.$('#view');
    UI.clear(view);
    UI._chartQueue = [];
    window.scrollTo(0, 0);
    var node;
    try {
      node = def.render(r.params);
    } catch (e) {
      console.error(e);
      node = UI.h('div.page', {}, UI.h('div.empty', {}, UI.h('div.empty-emoji', {}, '😵'), UI.h('p', {}, '页面出错：' + e.message)));
    }
    view.appendChild(node);
    UI.buildTopbar(def, r.params);
    UI.buildTabbar(def.tab);
    document.body.dataset.page = r.name;
    current = def;
    if (def.mount) def.mount(view, r.params);
    UI.renderCharts();
  };
  /* 图表需在 DOM 插入后才能测量尺寸，统一延迟绘制 */
  UI._chartQueue = [];
  UI.deferChart = function (fn) { UI._chartQueue.push(fn); };
  UI.renderCharts = function () {
    var q = UI._chartQueue; UI._chartQueue = [];
    q.forEach(function (fn) { try { fn(); } catch (e) { console.warn('chart', e); } });
  };
  window.addEventListener('hashchange', UI.render);

  UI.buildTopbar = function (def, params) {
    var bar = UI.$('#topbar');
    UI.clear(bar);
    if (def.header === 'none') { bar.style.display = 'none'; return; }
    bar.style.display = '';
    var actions = typeof def.actions === 'function' ? def.actions(params) : (def.actions || []);
    bar.appendChild(UI.h('div.topbar-inner', {},
      def.tab && def.tab !== 'home' ? null : UI.h('div.topbar-title', {},
        UI.h('div.topbar-greet', {}, def.greet || ''),
        UI.h('div.topbar-name', {}, typeof def.title === 'function' ? def.title(params) : (def.title || ''))),
      def.tab && def.tab !== 'home' ? UI.h('div.topbar-title.simple', {}, UI.h('div.topbar-name', {}, typeof def.title === 'function' ? def.title(params) : (def.title || ''))) : null,
      UI.h('div.topbar-actions', {}, actions.map(function (a) {
        return UI.h('button.icon-btn', { onclick: a.onTap, 'aria-label': a.label || '' }, a.emoji ? UI.h('span', {}, a.emoji) : UI.icon(a.icon || 'more', 21));
      }), UI.h('button.icon-btn.avatar', { onclick: function () { UI.go('me'); }, 'aria-label': '我的' },
        UI.h('span', {}, FA.store.db.settings.nickname ? FA.store.db.settings.nickname.slice(0, 1) : '我')))));
  };

  var TABS = [
    { id: 'home', label: '首页', icon: 'home' },
    { id: 'txns', label: '流水', icon: 'list' },
    { id: 'import', label: '', icon: 'plus', fab: true },
    { id: 'plan', label: '规划', icon: 'target' },
    { id: 'report', label: '报告', icon: 'chart' }
  ];
  UI.buildTabbar = function (active) {
    var bar = UI.$('#tabbar');
    UI.clear(bar);
    TABS.forEach(function (t) {
      if (t.fab) {
        bar.appendChild(UI.h('button.tab.fab', { onclick: function () { UI.go('import'); }, 'aria-label': '导入账单' }, UI.icon('plus', 28)));
        return;
      }
      bar.appendChild(UI.h('button.tab' + (active === t.id ? '.on' : ''), { onclick: function () { UI.go(t.id); } },
        UI.icon(t.icon, 22), UI.h('span', {}, t.label)));
    });
  };

  /* ---------------- 常用片段 ---------------- */
  UI.empty = function (emoji, title, desc, action) {
    var art = (FA.illust && FA.illust.svg[emoji]) ? UI.illust(emoji, 92) : UI.h('div.empty-emoji', {}, emoji || '📭');
    return UI.h('div.empty', {}, art,
      UI.h('div.empty-title', {}, title || '暂无数据'),
      desc ? UI.h('div.empty-desc', {}, desc) : null,
      action ? UI.h('button.btn.primary.mt', { onclick: action.onTap }, action.label) : null);
  };
  UI.card = function (cls, kids) {
    return UI.h('div.card' + (cls ? '.' + cls : ''), {}, kids);
  };
  UI.sectionTitle = function (title, right) {
    return UI.h('div.section-title', {}, UI.h('span', {}, title), right || null);
  };
  UI.progressBar = function (pct, color) {
    return UI.h('div.pbar', {}, UI.h('div.pbar-fill', { style: { width: Math.min(100, Math.max(0, pct * 100)) + '%', background: color || 'var(--accent)' } }));
  };
  UI.avatar = function (emoji, color, size) {
    return UI.h('span.avatar-ic', { style: { background: (color || '#888') + '22', color: color || '#888', width: (size || 40) + 'px', height: (size || 40) + 'px', fontSize: ((size || 40) * 0.5) + 'px' } }, emoji || '📦');
  };
  UI.monthPicker = function (ym, onChange) {
    var sel = UI.h('select.month-picker');
    FA.report.availableMonths().forEach(function (m) {
      sel.appendChild(UI.h('option', { value: m, selected: m === ym }, U.monthLabel(m)));
    });
    sel.addEventListener('change', function () { onChange(sel.value); });
    return sel;
  };
  UI.relTime = function (ts) {
    var d = (Date.now() - ts) / 1000;
    if (d < 60) return '刚刚';
    if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
    if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
    return Math.floor(d / 86400) + ' 天前';
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>/* ==== js/views-main.js ==== */
/* FlowAtlas · 主视图：首页仪表盘 / 流水明细 / 交易详情 */
(function (root) {
  'use strict';
  var FA = root.FA, U = FA.util, UI = FA.ui, S = FA.store, h = UI.h;
  var V = (FA.views = FA.views || {});

  /* ================= 共用：交易行 ================= */
  V.txnRow = function (t, opt) {

      h('div.txn-icon', {}, UI.catIllust(t.category, 42)),
      h('div.txn-main', {},
        h('div.txn-title', {}, FA.cat.aliasOf(FA.cat.normalizeMerchant(t.merchant)) || t.merchant || '未知商户'),
        h('div.txn-sub', {}, [
          U.fmtDate(t.time, 'time'),
          t.sub || cat.name,
          acc.icon + acc.name,
          (t.tags || []).length ? (t.tags || []).slice(0, 2).join('·') : null
        ].filter(Boolean).join(' · '))),
      h('div.txn-amount', {},
        h('div.money.' + UI.dirClass(t), {}, (opt.selMode ? '' : UI.dirSign(t)) + UI.money(t.amount)),
        t.auto && t.auto.source === 'fallback' && !t.excluded ? h('div.txn-badge', {}, '待确认') : null));
    if (opt.selMode) {
      row.insertBefore(h('div.sel-check' + (opt.selected ? '.on' : ''), {}, opt.selected ? UI.icon('check', 16) : null), row.firstChild);
    }
    UI.longPress(row, function () { opt.onLong ? opt.onLong(t) : V.quickActions(t, opt.after); });

  };

  V.quickActions = function (t, after) {
    UI.actions('快速操作', [
      { icon: 'edit', label: '编辑这笔', onTap: function () { V.editTxn(t, after); } },
      { icon: 'grid', label: '修改分类', onTap: function () { V.pickCategory(t.direction, t.category, t.sub, function (c, s2) { V.applyCategory(t, c, s2); after && after(); }); } },
      { icon: 'swap', label: '标记为内部转账', onTap: function () { S.updateTxn(t.id, { direction: 'transfer', category: 'transfer', excluded: true }); UI.toast('已标记为转账并从收支中排除'); after && after(); } },
      { icon: 'link', label: '添加标签', onTap: function () { V.addTag(t, after); } },
      { icon: 'trash', label: '删除', danger: true, onTap: function () { UI.confirm('删除后不可恢复，确定删除这笔交易？', { danger: true, okText: '删除' }).then(function (ok) { if (ok) { S.removeTxn(t.id); UI.toast('已删除'); after && after(); } }); } }
    ]);
  };

  V.applyCategory = function (t, category, sub) {
    S.updateTxn(t.id, { category: category, sub: sub || '', auto: { source: 'user', confidence: 1, at: Date.now() } });
    S.correction(FA.cat.merchantKey(t), category, sub);
