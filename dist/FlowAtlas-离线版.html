  };

  V.addTag = function (t, after) {
    UI.form({ title: '标签', fields: [{ key: 'tag', label: '标签（多个用空格分隔）', value: (t.tags || []).join(' ') }] }).then(function (v) {
      if (!v) return;
      S.updateTxn(t.id, { tags: U.uniq(String(v.tag).split(/\s+/).filter(Boolean)) });
      after && after();
    });
  };

  V.pickCategory = function (dir, curCat, curSub, cb) {
    var tab = dir === 'income' ? 'income' : dir === 'transfer' ? 'transfer' : 'expense';
    var body = h('div.cat-picker');
    var tabsRow = h('div.seg');
    var listWrap = h('div.cat-grid');
    function draw() {
      UI.clear(listWrap);
      S.catList(tab).forEach(function (c) {
        var btn = h('button.cat-cell' + (c.id === curCat ? '.on' : ''), {
          onclick: function () {
            if (c.subs && c.subs.length > 1) { subWrap.style.display = ''; drawSubs(c); }
            else { close(); cb(c.id, c.subs ? c.subs[0] : ''); }
          }
        }, h('span.cat-cell-ic', {}, UI.catIllust(c.id, 40)), h('span', {}, c.name));
        listWrap.appendChild(btn);
      });
    }
    var subWrap = h('div.sub-wrap', { style: { display: 'none' } });
    function drawSubs(c) {
      UI.clear(subWrap);
      subWrap.appendChild(h('div.section-title', {}, c.name + ' · 子分类'));
      var row = h('div.chips-input');
      (c.subs || []).forEach(function (s2) {
        row.appendChild(h('button.chip' + (s2 === curSub ? '.on' : ''), { onclick: function () { close(); cb(c.id, s2); } }, s2));
      });
      subWrap.appendChild(row);
    }
    [['expense', '支出'], ['income', '收入'], ['transfer', '转账/资金']].forEach(function (p) {
      tabsRow.appendChild(h('button' + (p[0] === tab ? '.on' : ''), { onclick: function (e) { tab = p[0]; UI.$$('button', tabsRow).forEach(function (b) { b.classList.remove('on'); }); e.target.classList.add('on'); subWrap.style.display = 'none'; draw(); } }, p[1]));
    });
    body.appendChild(tabsRow); body.appendChild(listWrap); body.appendChild(subWrap);
    draw();
    var s = UI.sheet({ title: '选择分类', subtitle: '选择后会自动记住该商户', body: body, size: 'full' });
    var close = s.close;
  };

  V.editTxn = function (t, after) {
    var accs = S.db.accounts.map(function (a) { return { v: a.id, label: a.icon + ' ' + a.name }; });
    UI.form({
      title: '编辑交易',
      fields: [
        { key: 'amount', label: '金额', type: 'number', value: t.amount, required: true },
        { key: 'direction', label: '方向', type: 'select', value: t.direction, options: [{ v: 'expense', label: '支出' }, { v: 'income', label: '收入' }, { v: 'transfer', label: '转账' }] },
        { key: 'merchant', label: '商户 / 对方', value: t.merchant },
        { key: 'item', label: '商品说明', value: t.item },
        { key: 'time', label: '时间', type: 'date', value: U.ymd(t.time) },
        { key: 'accountId', label: '账户', type: 'select', value: t.accountId, options: accs },
        { key: 'category', label: '分类', type: 'select', value: t.category, options: S.catList(t.direction === 'income' ? 'income' : 'expense').map(function (c) { return { v: c.id, label: c.icon + ' ' + c.name }; }) },
        { key: 'note', label: '备注', value: t.note },
        { key: 'excluded', label: '不计入收支统计', type: 'switch', value: !!t.excluded }
      ]
    }).then(function (v) {
      if (!v) return;
      var ts = U.parseDate(v.time);
      S.updateTxn(t.id, {
        amount: U.round2(Math.abs(v.amount)), direction: v.direction, merchant: v.merchant, item: v.item,
        time: isNaN(ts) ? t.time : ts, accountId: v.accountId, category: v.category, note: v.note, excluded: v.excluded
      });
      UI.toast('已保存'); after && after();
    });
  };

  /* 交易详情 */
  V.txnSheet = function (id, after) {
    var t = S.txn(id);
    if (!t) return;
    var cat = S.cat(t.category), acc = S.account(t.accountId);
    function line(k, v, cls) { return h('div.detail-line', {}, h('span.detail-k', {}, k), h('span.detail-v' + (cls ? '.' + cls : ''), {}, v)); }
    var body = h('div.txn-detail', {},
      h('div.detail-hero', { style: { background: 'linear-gradient(135deg,' + cat.color + '33,' + cat.color + '11)' } },
        h('div.detail-cat', {}, UI.catIllust(t.category, 58)),
        h('div.detail-amount.' + UI.dirClass(t), {}, UI.dirSign(t) + UI.money(t.amount)),
        h('div.detail-merchant', {}, t.merchant || '未知商户'),
        h('div.detail-tags', {}, UI.catChip(t.category), t.sub ? h('span.chip.mini', {}, t.sub) : null,
          (t.tags || []).map(function (x) { return h('span.chip.mini', {}, x); }), t.excluded ? h('span.chip.mini.warn', {}, '已排除') : null)),
      h('div.detail-lines', {},
        line('时间', U.fmtDate(t.time, 'full')),
        line('账户', acc.icon + ' ' + acc.name),
        line('商品说明', t.item || '—'),
        line('支付方式', t.payMethod || '—'),
        line('订单状态', t.status === 'success' ? '交易成功' : t.status === 'refunded' ? '已退款' : t.status),
        line('交易单号', t.orderNo || '—'),
        line('来源', (FA.parser.SOURCE_META[t.source] || {}).name || t.source || '手动'),
        line('自动分类', t.auto ? (t.auto.source + ' · ' + Math.round((t.auto.confidence || 0) * 100) + '%') : '—'),
        line('备注', t.note || '—')),
      h('div.quick-btns', {},
        h('button.qbtn', { onclick: function () { close(); setTimeout(function () { V.editTxn(t, after); }, 200); } }, UI.icon('edit', 18), h('span', {}, '编辑')),
        h('button.qbtn', { onclick: function () { close(); setTimeout(function () { V.pickCategory(t.direction, t.category, t.sub, function (c, s2) { V.applyCategory(t, c, s2); after && after(); }); }, 200); } }, UI.icon('grid', 18), h('span', {}, '改分类')),
        h('button.qbtn', { onclick: function () { close(); setTimeout(function () { V.addTag(t, after); }, 200); } }, UI.icon('tag', 18), h('span', {}, '标签')),
        h('button.qbtn', { onclick: function () { close(); setTimeout(function () { V.splitTxn(t, after); }, 200); } }, UI.icon('split', 18), h('span', {}, '拆分')),
        h('button.qbtn', { onclick: function () { S.updateTxn(t.id, { excluded: !t.excluded }); close(); UI.toast(t.excluded ? '已恢复统计' : '已排除统计'); after && after(); } }, UI.icon('eyeoff', 18), h('span', {}, t.excluded ? '恢复' : '排除')),
        h('button.qbtn.danger', { onclick: function () { UI.confirm('确定删除这笔交易？', { danger: true, okText: '删除' }).then(function (ok) { if (ok) { S.removeTxn(t.id); close(); UI.toast('已删除'); after && after(); } }); } }, UI.icon('trash', 18), h('span', {}, '删除'))));
    var s = UI.sheet({ title: '交易详情', body: body });
    var close = s.close;
  };

  V.splitTxn = function (t, after) {

      title: '拆分交易',
      subtitle: '把 ' + UI.money(t.amount) + ' 拆成若干笔，便于分开归类',

        { key: 'ca', label: '第一笔分类', type: 'select', value: t.category, options: S.catList('expense').map(function (c) { return { v: c.id, label: c.icon + ' ' + c.name }; }) },

      S.addTxn(Object.assign({}, t, { id: U.uid('tx'), amount: b, category: v.cb, item: v.ib, note: (t.note || '') + ' [拆分2/2]', orderNo: (t.orderNo || '') + '-S2', auto: { source: 'user', confidence: 1 } }));

  /* ================= 首页 ================= */
  var HOME_YM = null;
  FA.ui.register('home', {
    tab: 'home', header: 'home',

      var hr = new Date().getHours();

      return [

        { icon: 'bell', label: '提醒', onTap: function () { V.notificationsSheet(); } }

    },
    render: function () {
      var ym = HOME_YM || U.ym(Date.now());

      var nw = S.netWorth();
      var rp = FA.report.build(ym);
      var budgetTotal = 0, budgetSpent = 0;
      rp.budgets.forEach(function (b) { budgetTotal += b.amount; budgetSpent += b.spent; });
      var wrap = h('div.page.home');

      },
        coverUrl ? h('div.hero-veil') : null,
        h('div.hero-bg'),
        h('div.hero-art', {}, UI.illust('networth', 104)),
        h('div.hero-top', {},
          h('div', {}, h('div.hero-label', {}, '净资产'), h('div.hero-net', {}, UI.money(nw.net))),
          h('div.hero-badge', { class: nw.net >= 0 ? 'up' : 'down' }, nw.net >= 0 ? '健康' : '负债')),
        h('div.hero-split', {},
          h('div', {}, h('span.hero-k', {}, '💎 资产'), h('span.hero-v', {}, UI.money(nw.assets))),
          h('div', {}, h('span.hero-k', {}, '💳 负债'), h('span.hero-v', {}, UI.money(nw.debts)))),
        h('div.hero-months', {}, FA.report.availableMonths().slice(0, 6).map(function (m) {
          return h('button.chip.mini' + (m === ym ? '.on' : ''), { onclick: function () { HOME_YM = m; UI.render(); } }, (+m.split('-')[1]) + '月');
        }))));

      /* 本月收支 */
      var ringCanvas = h('canvas');
      wrap.appendChild(h('div.card.month-card', {},
        h('div.mcard-left', {},
          h('div.mc-item', {}, h('span.mc-k', {}, '支出'), h('span.mc-v.expense', {}, UI.money(cur.expense))),
          h('div.mc-item', {}, h('span.mc-k', {}, '收入'), h('span.mc-v.income', {}, UI.money(cur.income))),
          h('div.mc-item', {}, h('span.mc-k', {}, '结余'), h('span.mc-v.' + (cur.net >= 0 ? 'income' : 'expense'), {}, UI.money(cur.net)))),
        h('div.mcard-right', {}, ringCanvas, h('div.ring-cap', {}, budgetTotal ? '预算使用' : '本月储蓄率')),
        h('div.mcard-foot', {},
          h('span', {}, '共 ' + cur.count + ' 笔 · 日均 ' + UI.money(rp.avgDaily)),
          h('span.link', { onclick: function () { UI.go('report', { m: ym }); } }, '月报 →'))));
      UI.deferChart(function () {
        FA.chart.ring(ringCanvas, {
          w: 96, h: 96, lw: 8,
          value: budgetTotal ? budgetSpent / budgetTotal : Math.max(0, cur.savingsRate),
          label: budgetTotal ? Math.round((budgetSpent / budgetTotal) * 100) + '%' : Math.round(Math.max(0, cur.savingsRate) * 100) + '%'
        });
      });

      /* 快捷宫格 */
      var quick = [
        { i: 'budget', n: '预算', go: ['plan', { tab: 'budget' }] },
        { i: 'goal', n: '目标', go: ['plan', { tab: 'goal' }] },
        { i: 'debt', n: '债务', go: ['plan', { tab: 'debt' }] },
        { i: 'sub', n: '订阅', go: ['plan', { tab: 'sub' }] },
        { i: 'account', n: '账户', go: ['accounts'] },
        { i: 'report', n: '报告', go: ['report', {}] },
        { i: 'import', n: '导入', go: ['import'] },
        { i: 'rule', n: '设置', go: ['me'] }
      ];
      wrap.appendChild(h('div.quick-grid', {}, quick.map(function (q) {
        return h('button.quick-cell', { onclick: function () { UI.go(q.go[0], q.go[1]); } },
          h('span.quick-ic', {}, UI.illust(q.i, 42)), h('span.quick-name', {}, q.n));
      })));

      /* 提醒 */
      var notes = V.buildNotifications();
      if (notes.length) {
        wrap.appendChild(h('div.alert-strip', { onclick: function () { V.notificationsSheet(); } },
          h('span.alert-ic', {}, notes[0].icon),
          h('div', {}, h('div.alert-title', {}, notes[0].title), h('div.alert-desc', {}, notes[0].desc)),
          notes.length > 1 ? h('span.alert-count', {}, '+' + (notes.length - 1)) : null));
      }

      /* 洞察 */
      if (rp.insights.length) {
        wrap.appendChild(UI.sectionTitle('本月洞察', h('span.link', { onclick: function () { UI.go('report', { m: ym }); } }, '全部'), 'insight'));
        wrap.appendChild(h('div.insight-scroll', {}, rp.insights.slice(0, 4).map(function (x) {
          return h('div.insight-chip.' + x.tone, {}, h('span.ins-ic', {}, x.icon), h('span', {}, x.text));
        })));
      }

      /* 预算快览 */
      if (rp.budgets.length) {
        wrap.appendChild(UI.sectionTitle('预算快览', h('span.link', { onclick: function () { UI.go('plan', { tab: 'budget' }); } }, '管理'), 'budget'));
        wrap.appendChild(h('div.card.budget-mini', {}, rp.budgets.slice(0, 3).map(function (b) {
          return h('div.bm-row', {},
            h('div.bm-top', {}, h('span', {}, b.icon + ' ' + b.name), h('span', { class: b.pct > 1 ? 'neg' : 'dim' }, UI.money(b.spent) + ' / ' + UI.money(b.amount))),
            UI.progressBar(b.pct, b.pct > 1 ? '#EF4444' : b.pct > 0.8 ? '#F59E0B' : b.color));
        })));
      }

      /* 最近交易 */
      var recent = U.sortBy(S.db.txns.filter(function (t) { return !t.excluded; }), function (t) { return t.time; }, true).slice(0, 6);
      wrap.appendChild(UI.sectionTitle('最近流水', h('span.link', { onclick: function () { UI.go('txns'); } }, '全部'), 'transfer'));
      wrap.appendChild(h('div.card.list-card', {}, recent.length ? recent.map(function (t) { return V.txnRow(t); }) : UI.empty('welcome', '还没有交易', '从「导入」开始，或手动记一笔')));
      return wrap;
    },
    mount: function () { }
  });

  /* ================= 提醒 ================= */
  V.buildNotifications = function () {
    var out = [], now = Date.now(), ym = U.ym(now);
    S.db.subs.forEach(function (s2) {
      if (s2.status === 'cancelled') return;
      if (s2.nextDate && s2.nextDate - now < 5 * 86400000 && s2.nextDate - now > -2 * 86400000) {
        out.push({ icon: '🔁', title: s2.name + ' 即将扣款', desc: UI.money(s2.amount) + ' · ' + U.fmtDate(s2.nextDate, 'md') + ' 前后自动续费' });
      }
    });
    S.db.debts.forEach(function (d) {
      if (d.status === 'closed' || !d.dueDay) return;
      var d2 = new Date(); d2.setDate(d.dueDay);
      var diff = U.dayStart(d2.getTime()) - U.dayStart(now);
      if (diff >= 0 && diff < 5 * 86400000) out.push({ icon: '💳', title: d.name + ' 账单日临近', desc: '每月 ' + d.dueDay + ' 日 · 最低还款 ' + UI.money(d.minPayment || 0) });
    });
    FA.report.build(ym).budgets.forEach(function (b) {
      if (b.pct > 1) out.push({ icon: '💥', title: b.name + ' 已超预算', desc: '超支 ' + UI.money(b.spent - b.amount) });
      else if (b.pace > 1.15) out.push({ icon: '⚠️', title: b.name + ' 花得比计划快', desc: '已用 ' + Math.round(b.pct * 100) + '%，建议日均 ' + UI.money(b.dailyAllowance) });
    });
    var lastImport = S.db.imports.length ? S.db.imports[S.db.imports.length - 1] : null;
    if (!lastImport || now - lastImport.at > 7 * 86400000) {
      out.push({ icon: '📥', title: '该导入新账单了', desc: lastImport ? '上次导入 ' + U.relTime(lastImport.at) : '还没有导入过任何账单' });
    }
    var curM = FA.report.build(ym);
    if (curM.count > 0) out.push({ icon: '📊', title: U.monthLabel(ym) + ' 月报已可查看', desc: '支出 ' + UI.money(curM.expense) + ' · 储蓄率 ' + Math.round(curM.savingsRate * 100) + '%' });
    return out;
  };
  V.notificationsSheet = function () {
    var notes = V.buildNotifications();
    UI.sheet({
      title: '提醒中心', subtitle: notes.length ? notes.length + ' 条待处理' : '暂无提醒',
      body: notes.length ? h('div.notif-list', {}, notes.map(function (n) {
        return h('div.notif-item', {}, h('span.notif-ic', {}, n.icon), h('div', {}, h('div.notif-title', {}, n.title), h('div.notif-desc', {}, n.desc)));
      })) : UI.empty('remind', '一切正常', '没有需要处理的提醒')
    });
  };

  /* ================= 流水 ================= */
  var TX = { q: '', dir: 'all', cat: '', acc: '', from: '', to: '', selMode: false, sel: {} };
  FA.ui.register('txns', {
    tab: 'txns', title: '全部流水',
    actions: function () {
      return [
        { icon: 'filter', label: '筛选', onTap: function () { V.filterSheet(); } },
        { icon: 'plus', label: '记一笔', onTap: function () { V.manualSheet(); } }
      ];
    },
    render: function () {
      var page = h('div.page.txns');
      var search = h('input.search-input', { placeholder: '搜索商户 / 商品 / 备注 / 单号', value: TX.q });
      var listWrap = h('div.txn-list-wrap');
      var sumBar = h('div.tx-sum-bar');
      var selBar = h('div.sel-bar');
      var deb = U.debounce(function () { TX.q = search.value; redraw(); }, 220);
      search.addEventListener('input', deb);
      page.appendChild(h('div.search-row', {}, h('span.search-ic', {}, UI.icon('search', 18)), search,
        TX.q ? h('button.icon-btn', { onclick: function () { TX.q = ''; search.value = ''; redraw(); } }, UI.icon('close', 16)) : null));
      var chips = h('div.chip-row');
      [['all', '全部'], ['expense', '支出'], ['income', '收入'], ['transfer', '转账']].forEach(function (p) {
        chips.appendChild(h('button.chip' + (TX.dir === p[0] ? '.on' : ''), { onclick: function () { TX.dir = p[0]; redraw(); UI.$$('.chip-row .chip', page).forEach(function (c, i) { c.classList.toggle('on', ['all', 'expense', 'income', 'transfer'][i] === TX.dir); }); } }, p[1]));
      });
      chips.appendChild(h('button.chip.ghost', { onclick: function () { V.filterSheet(); } }, UI.icon('filter', 14) + ' 高级'));
      if (TX.cat) chips.appendChild(h('button.chip.on', { onclick: function () { TX.cat = ''; redraw(); } }, S.catName(TX.cat) + ' ✕'));
      if (TX.acc) chips.appendChild(h('button.chip.on', { onclick: function () { TX.acc = ''; redraw(); } }, S.account(TX.acc).name + ' ✕'));
      page.appendChild(chips);
      page.appendChild(sumBar);
      page.appendChild(listWrap);
      page.appendChild(selBar);
      function redraw() {
        var list = S.filterTxns({ q: TX.q, direction: TX.dir === 'all' ? '' : TX.dir, category: TX.cat, accountId: TX.acc, from: TX.from ? U.parseDate(TX.from) : 0, to: TX.to ? U.parseDate(TX.to) + 86400000 : 0, includeExcluded: true });
        if (TX.dir !== 'transfer') list = list.filter(function (t) { return true; });
        list.sort(function (a, b) { return b.time - a.time; });
        var inc = 0, exp = 0;
        list.forEach(function (t) { if (t.direction === 'income') inc += t.amount; else if (t.direction === 'expense') exp += t.amount; });
        UI.clear(sumBar);
        sumBar.appendChild(h('span', {}, '筛选结果 ' + list.length + ' 笔'));
        sumBar.appendChild(h('span', {}, h('span.income', {}, '收 ' + UI.money(inc)), '  ', h('span.expense', {}, '支 ' + UI.money(exp))));
        UI.clear(listWrap);
        if (!list.length) { listWrap.appendChild(UI.empty('empty', '没有匹配的交易', '换个关键词或清除筛选条件')); return; }
        var groups = U.groupBy(list, function (t) { return U.ymd(t.time); });
        Object.keys(groups).sort().reverse().forEach(function (day) {
          var g = groups[day];
          var dayExp = U.sum(g.filter(function (t) { return t.direction === 'expense'; }), function (t) { return t.amount; });
          var dayInc = U.sum(g.filter(function (t) { return t.direction === 'income'; }), function (t) { return t.amount; });
          listWrap.appendChild(h('div.day-head', {},
            h('span', {}, U.relDay(g[0].time)),
            h('span.day-sum', {}, (dayInc ? '收 ' + UI.money(dayInc) + ' ' : '') + (dayExp ? '支 ' + UI.money(dayExp) : ''))));
          var card = h('div.card.list-card');
          g.forEach(function (t) {
            card.appendChild(V.txnRow(t, {
              selMode: TX.selMode, selected: !!TX.sel[t.id],
              onTap: function (tx) {
                if (TX.selMode) { TX.sel[tx.id] = !TX.sel[tx.id]; redraw(); updateSelBar(); }
                else V.txnSheet(tx.id, redraw);
              },
              onLong: function (tx) { TX.selMode = true; TX.sel[tx.id] = true; redraw(); updateSelBar(); }
            }));
          });
          listWrap.appendChild(card);
        });
        updateSelBar();
      }
      function updateSelBar() {
        UI.clear(selBar);
        if (!TX.selMode) return;
        var ids = Object.keys(TX.sel).filter(function (k) { return TX.sel[k]; });
        selBar.appendChild(h('span', {}, '已选 ' + ids.length + ' 笔'));
        selBar.appendChild(h('div.sel-acts', {},
          h('button.btn.small', { onclick: function () { batchCategory(ids); } }, '改分类'),
          h('button.btn.small', { onclick: function () { batchAccount(ids); } }, '改账户'),
          h('button.btn.small', { onclick: function () { batchTag(ids); } }, '加标签'),
          h('button.btn.small.danger', { onclick: function () { UI.confirm('删除选中的 ' + ids.length + ' 笔交易？', { danger: true, okText: '删除' }).then(function (ok) { if (ok) { ids.forEach(function (id) { S.removeTxn(id); }); TX.sel = {}; TX.selMode = false; UI.toast('已删除 ' + ids.length + ' 笔'); redraw(); } }); } }, '删除'),
          h('button.btn.small.ghost', { onclick: function () { TX.sel = {}; TX.selMode = false; redraw(); } }, '退出')));
      }
      function batchCategory(ids) {
        V.pickCategory('expense', '', '', function (c, s2) {
          ids.forEach(function (id) { var t = S.txn(id); S.updateTxn(id, { category: c, sub: s2, auto: { source: 'user', confidence: 1 } }); if (t) S.correction(FA.cat.merchantKey(t), c, s2); });
          TX.sel = {}; TX.selMode = false; UI.toast('已批量修改分类'); redraw();
        });
      }
      function batchAccount(ids) {
        UI.form({ title: '移动到账户', fields: [{ key: 'acc', label: '目标账户', type: 'select', options: S.db.accounts.map(function (a) { return { v: a.id, label: a.icon + ' ' + a.name }; }) }] }).then(function (v) {
          if (!v) return;
          ids.forEach(function (id) { S.updateTxn(id, { accountId: v.acc }); });
          TX.sel = {}; TX.selMode = false; UI.toast('已移动'); redraw();
        });
      }
      function batchTag(ids) {
        UI.form({ title: '批量标签', fields: [{ key: 'tag', label: '标签（空格分隔）' }] }).then(function (v) {
          if (!v) return;
          var tags = String(v.tag).split(/\s+/).filter(Boolean);
          ids.forEach(function (id) { var t = S.txn(id); S.updateTxn(id, { tags: U.uniq((t.tags || []).concat(tags)) }); });
          TX.sel = {}; TX.selMode = false; UI.toast('已添加标签'); redraw();
        });
      }
      redraw();
      return page;
    }
  });

  V.filterSheet = function () {
    UI.form({
      title: '高级筛选',
      fields: [
        { key: 'cat', label: '分类', type: 'select', value: TX.cat, options: [{ v: '', label: '不限' }].concat(S.CATS.expense.concat(S.CATS.income).map(function (c) { return { v: c.id, label: c.icon + ' ' + c.name }; })) },
        { key: 'acc', label: '账户', type: 'select', value: TX.acc, options: [{ v: '', label: '不限' }].concat(S.db.accounts.map(function (a) { return { v: a.id, label: a.icon + ' ' + a.name }; })) },
        { key: 'from', label: '起始日期', type: 'date', value: TX.from },
        { key: 'to', label: '结束日期', type: 'date', value: TX.to },
        { key: 'amountMin', label: '金额下限', type: 'number', value: '' },
        { key: 'tags', label: '标签包含', value: '' }
      ],
      submitText: '应用筛选'
    }).then(function (v) {
      if (!v) return;
      TX.cat = v.cat || ''; TX.acc = v.acc || ''; TX.from = v.from || ''; TX.to = v.to || '';
      UI.toast('已应用筛选'); UI.render();
    });
  };

  V.manualSheet = function (after) {
    var now = new Date();
    UI.form({
      title: '手动记一笔',
      subtitle: '截图 OCR 失败时的快速补录通道',
      fields: [
        { key: 'amount', label: '金额', type: 'number', required: true, placeholder: '0.00' },
        { key: 'direction', label: '方向', type: 'select', value: 'expense', options: [{ v: 'expense', label: '支出' }, { v: 'income', label: '收入' }, { v: 'transfer', label: '转账' }] },
        { key: 'merchant', label: '商户 / 对方', placeholder: '例如：楼下便利店' },
        { key: 'item', label: '商品说明' },
        { key: 'category', label: '分类', type: 'select', options: S.catList('expense').map(function (c) { return { v: c.id, label: c.icon + ' ' + c.name }; }) },
        { key: 'accountId', label: '账户', type: 'select', options: S.db.accounts.map(function (a) { return { v: a.id, label: a.icon + ' ' + a.name }; }) },
        { key: 'time', label: '日期', type: 'date', value: U.ymd(now) },
        { key: 'note', label: '备注' }
      ],
      submitText: '保存'
    }).then(function (v) {
      if (!v) return;
      var t = FA.parser.manualTxn(Object.assign(v, { time: U.parseDate(v.time) }));
      S.addTxn(t);
      var cl = FA.cat.classify(t, { corrections: S.db.corrections, model: FA.cat.buildModel(S.db) });
      if (!v.category || v.category === 'other') S.updateTxn(t.id, { category: cl.category, sub: cl.sub, auto: { source: cl.source, confidence: cl.confidence } });
      UI.toast('已记一笔 ' + UI.money(t.amount));
      after && after();
    });
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>/* ==== js/views-plan.js ==== */
/* FlowAtlas · 规划模块：预算 / 储蓄目标 / 债务 / 订阅 + 账户管理 */
(function (root) {
  'use strict';
  var FA = root.FA, U = FA.util, UI = FA.ui, S = FA.store, h = UI.h;
  var V = FA.views;

  function catOptions() {
    return S.CATS.expense.concat(S.CATS.income).map(function (c) { return { v: c.id, label: c.icon + ' ' + c.name }; });
  }
  function banner(illust, title, desc) {
    return h('div.mod-banner', {}, UI.illust(illust, 54),
      h('div', {}, h('div.mod-banner-t', {}, title), h('div.mod-banner-d', {}, desc)));
  }
  function accIllust(a) {
    return UI.illust({ wechat: 'wechat', alipay: 'alipay', bank: 'bank', cash: 'cash' }[a.type] || 'account', 42);
  }
  var ICON_CHOICES = ['🎯', '🏆', '✈️', '🏠', '🚗', '💻', '📱', '🎓', '💍', '🐶', '🎁', '🏥', '🧳', '🎮', '📷', '⌚️', '💰', '🛟'];
  var COLOR_CHOICES = ['#FF6B6B', '#4D96FF', '#22C55E', '#F59E0B', '#8E7CFF', '#2ED3B7', '#F473B9', '#EF4444'];

  /* ================= 规划页 ================= */
  FA.ui.register('plan', {
    tab: 'plan', title: '财务规划',
    actions: function () { return [{ icon: 'chart', label: '月度报告', onTap: function () { UI.go('report'); } }]; },
    render: function (p) {
      var tab = p.tab || 'budget';
      var wrap = h('div.page.plan');
      var tabs = [['budget', '预算', '🎯'], ['goal', '目标', '🏆'], ['debt', '债务', '💳'], ['sub', '订阅', '🔁']];
      wrap.appendChild(h('div.seg.big', {}, tabs.map(function (t) {
        return h('button' + (tab === t[0] ? '.on' : ''), { onclick: function () { UI.go('plan', { tab: t[0] }, true); } }, t[2] + ' ' + t[1]);
      })));
      var body = h('div.plan-body');
      wrap.appendChild(body);
      ({ budget: budgetTab, goal: goalTab, debt: debtTab, sub: subTab })[tab](body);
      return wrap;
    }
  });

  /* ---------------- 预算 ---------------- */
  function budgetTab(body) {
    body.appendChild(banner('budget', '预算控制', '分类预算 + 总预算，超支前就会提醒你'));
    var ym = U.ym(Date.now());
    var list = S.db.budgets;
    var total = U.sum(list, function (b) { return b.amount; });
    var spent = 0, spentByBudget = {};
    list.forEach(function (b) {
      var cats = b.categories && b.categories.length ? b.categories : null;
      var scope = S.filterTxns({ ym: ym, direction: 'expense' });
      if (cats) scope = scope.filter(function (t) { return cats.indexOf(t.category) >= 0; });
      else scope = scope.filter(function (t) { return !list.some(function (x) { return x.id !== b.id && x.categories && x.categories.indexOf(t.category) >= 0; }); });
      var s2 = U.sum(scope, function (t) { return t.amount; });
      spentByBudget[b.id] = s2;
      if (!list.some(function (x) { return x.id !== b.id && x.categories && x.categories.indexOf('__all__') >= 0; })) spent += 0;
    });
    /* 总预算口径：所有预算覆盖的支出（不重复计算） */
    var allExp = S.summary({ ym: ym }).expense;
    var coveredCats = {};
    list.forEach(function (b) { (b.categories || []).forEach(function (c) { coveredCats[c] = 1; }); });
    var hasUnscoped = list.some(function (b) { return !b.categories || !b.categories.length; });
    var coveredSpent = U.sum(S.filterTxns({ ym: ym, direction: 'expense' }).filter(function (t) {
      return hasUnscoped || coveredCats[t.category];
    }), function (t) { return t.amount; });
    var days = new Date(U.monthRange(ym).end - 1).getDate();
    var today = new Date().getDate();

    body.appendChild(h('div.card.budget-hero', {},
      h('div.bh-row', {},
        h('div', {}, h('div.bh-label', {}, U.monthLabel(ym) + ' 总预算'), h('div.bh-total', {}, UI.money(total))),
        h('div.bh-right', {}, h('div.bh-label', {}, '已使用'), h('div.bh-spent.' + (coveredSpent > total ? 'neg' : ''), {}, UI.money(coveredSpent)))),
      UI.progressBar(total ? coveredSpent / total : 0, coveredSpent > total ? '#EF4444' : '#4D96FF'),
      h('div.bh-foot', {},
        h('span', {}, '剩余 ' + UI.money(Math.max(0, total - coveredSpent))),
        h('span', {}, '日均可用 ' + UI.money(Math.max(0, (total - coveredSpent) / Math.max(1, days - today + 1)))),
        h('span', {}, '本月支出 ' + UI.money(allExp)))));

    if (!list.length) {
      body.appendChild(UI.empty('budget', '还没有预算', '设置分类预算，超支会主动提醒你', { label: '新建预算', onTap: function () { budgetForm(); } }));
    } else {
      list.forEach(function (b) {
        var s2 = spentByBudget[b.id] || 0;
        var pct = b.amount > 0 ? s2 / b.amount : 0;
        var col = pct > 1 ? '#EF4444' : pct > 0.8 ? '#F59E0B' : (b.color || '#4D96FF');
        var left = Math.max(0, b.amount - s2);
        var daily = left / Math.max(1, days - today + 1);
        body.appendChild(h('div.card.budget-card', {
          onclick: function () {
            UI.actions(b.name, [

        time: Date.now(), tags: ['订阅']
      }));
      var next = s2.nextDate || Date.now();
      var days = { monthly: 30, quarterly: 91, yearly: 365, weekly: 7 }[s2.cycle] || 30;
      while (next < Date.now()) next += days * 86400000;
      S.update('subs', s2.id, { lastDate: Date.now(), nextDate: next });
      UI.toast('已记录扣款并顺延下次日期');
      UI.render();
    }
  }

  /* ================= 账户管理 ================= */
  FA.ui.register('accounts', {
    tab: 'home', title: '账户与数据源',
    actions: function () { return [{ icon: 'plus', label: '新增账户', onTap: function () { accountForm(); } }]; },
    render: function () {
      var wrap = h('div.page.accounts');
      var nw = S.netWorth();
      wrap.appendChild(h('div.card.account-hero', {},
        h('div.bh-row', {},
          h('div', {}, h('div.bh-label', {}, '账户资产合计'), h('div.bh-total', {}, UI.money(nw.assets))),
          h('div.bh-right', {}, h('div.bh-label', {}, '净资产'), h('div.bh-spent', {}, UI.money(nw.net))))));
      S.db.accounts.forEach(function (a) {
        var bal = S.accountBalance(a);
        var cnt = S.db.txns.filter(function (t) { return t.accountId === a.id; }).length;
        wrap.appendChild(h('div.card.account-card', {
          onclick: function () {
            UI.actions(a.name, [
              { icon: 'edit', label: '编辑账户', onTap: function () { accountForm(a); } },
              { icon: 'swap', label: '余额校准', onTap: function () { calibrate(a, bal); } },
              { icon: 'list', label: '查看该账户流水', onTap: function () { UI.go('txns', { acc: a.id }); } },
              { icon: 'trash', label: '删除账户', danger: true, onTap: function () { UI.confirm('删除账户「' + a.name + '」？该账户下的 ' + cnt + ' 笔交易会保留但失去归属。', { danger: true, okText: '删除' }).then(function (ok) { if (ok) { S.remove('accounts', a.id); UI.render(); } }); } }
            ]);
          }
        },
          accIllust(a),
          h('div.ac-mid', {}, h('div.ac-name', {}, a.name),
            h('div.ac-sub', {}, (S.ACCOUNT_TYPES.filter(function (t) { return t.id === a.type; })[0] || {}).name + ' · ' + cnt + ' 笔' + (a.include === false ? ' · 不计入净资产' : ''))),
          h('div.ac-bal', {}, h('div', {}, UI.money(bal)))));
      });
      wrap.appendChild(h('button.btn.block', { onclick: function () { accountForm(); } }, UI.icon('plus', 18) + ' 新增账户'));
      wrap.appendChild(h('div.tips', {}, '💡 微信、支付宝、银行卡、现金、其他都可以作为独立账户；导入账单时选择对应账户，余额会自动结算。'));
      return wrap;
    }
  });

  function accountForm(a) {
    a = a || {};
    UI.form({
      title: a.id ? '编辑账户' : '新增账户',
      fields: [
        { key: 'name', label: '账户名称', value: a.name || '', required: true, placeholder: '例如：招商银行储蓄卡' },
        { key: 'type', label: '类型', type: 'select', value: a.type || 'bank', options: S.ACCOUNT_TYPES.map(function (t) { return { v: t.id, label: t.icon + ' ' + t.name }; }) },
        { key: 'icon', label: '图标', type: 'chips', value: [a.icon || '💳'], options: ['💚', '💙', '💳', '💵', '🪙', '🏦', '📈', '🐷'].map(function (i) { return { v: i, label: i }; }) },
        { key: 'color', label: '颜色', type: 'chips', value: [a.color || '#4D96FF'], options: COLOR_CHOICES.map(function (c) { return { v: c, label: '●' }; }) },
        { key: 'initial', label: '当前余额（作为起始余额）', type: 'number', value: a.initial != null ? a.initial : (a.balance || 0) },
        { key: 'holder', label: '户名/尾号（用于识别本人转账）', value: a.holder || '', placeholder: '例如：招行****8888 或 我的名字' },
        { key: 'include', label: '计入净资产', type: 'switch', value: a.include !== false }
      ]
    }).then(function (v) {
      if (!v) return;
      var payload = { name: v.name, type: v.type, icon: (v.icon && v.icon[0]) || '💳', color: (v.color && v.color[0]) || '#4D96FF', initial: U.round2(v.initial || 0), balance: U.round2(v.initial || 0), holder: v.holder || '', include: v.include };
      if (a.id) S.update('accounts', a.id, payload); else S.add('accounts', payload);
      UI.toast('已保存'); UI.render();
    });
  }
  function calibrate(a, cur) {
    UI.form({
      title: '余额校准：' + a.name,
      subtitle: '当前账本余额 ' + UI.money(cur) + '，输入银行/微信里的真实余额，差额会记为「余额调整」',
      fields: [{ key: 'real', label: '真实余额', type: 'number', required: true, value: cur }, { key: 'asTxn', label: '同时记一笔调整交易', type: 'switch', value: true }]
    }).then(function (v) {
      if (!v) return;
      var diff = U.round2(v.real - cur);
      S.update('accounts', a.id, { initial: U.round2((a.initial || 0) + diff) });
      if (v.asTxn && Math.abs(diff) >= 0.01) {
        S.addTxn(FA.parser.manualTxn({
          amount: Math.abs(diff), direction: diff > 0 ? 'income' : 'expense', accountId: a.id,
          merchant: '余额校准调整', item: '对账差额', category: 'other', note: '校准差额 ' + U.money(diff), time: Date.now()
        }));
        var t = S.db.txns[S.db.txns.length - 1];
        S.updateTxn(t.id, { excluded: true });
      }
      UI.toast('已校准'); UI.render();
    });
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>/* ==== js/views-import.js ==== */
/* FlowAtlas · 账单导入：文件解析 / 预览 / 去重 / OCR / 历史 */
(function (root) {
  'use strict';
  var FA = root.FA, U = FA.util, UI = FA.ui, S = FA.store, h = UI.h, P = FA.parser;
  var V = FA.views;

  var IMP = { source: 'auto', accountId: null, files: [], results: null, busy: false, step: 1, ocr: [] };

  function defaultAccount() {
    if (IMP.accountId && S.byId('accounts', IMP.accountId)) return IMP.accountId;
    var a = S.db.accounts[0];
    return a ? a.id : null;
  }
  function accountForSource(src) {
    var meta = P.SOURCE_META[src];
    if (!meta) return defaultAccount();
    var hit = S.db.accounts.filter(function (a) { return a.type === meta.accountType; })[0];
    return hit ? hit.id : defaultAccount();
  }

  FA.ui.register('import', {
    tab: 'import', title: '导入账单',
    actions: function () { return [{ icon: 'doc', label: '导入历史', onTap: historySheet }]; },
    render: function () {
      var wrap = h('div.page.import');

      /* 步骤条 */
      wrap.appendChild(h('div.steps', {}, [
        ['1', '选择来源'], ['2', '上传文件'], ['3', '预览确认']
      ].map(function (s2, i) {
        return h('div.step' + (IMP.step >= i + 1 ? '.on' : ''), {}, h('span.step-n', {}, s2[0]), h('span', {}, s2[1]));
      })));

      /* 来源 */
      wrap.appendChild(UI.sectionTitle('1. 账单来源'));
      var srcRow = h('div.source-grid');
      [['auto', 'rule', '自动识别'], ['wechat', 'wechat', '微信支付'], ['alipay', 'alipay', '支付宝'], ['bank', 'bank', '银行卡'], ['cash', 'cash', '现金'], ['manual', 'manual', '手动补录']].forEach(function (s2) {
        srcRow.appendChild(h('button.source-cell' + (IMP.source === s2[0] ? '.on' : ''), {
          onclick: function () {
            if (s2[0] === 'manual') { V.manualSheet(function () { UI.render(); }); return; }
            IMP.source = s2[0];
            if (s2[0] !== 'auto') IMP.accountId = accountForSource(s2[0]);
            UI.render();
          }
        }, h('span.source-ic', {}, UI.illust(s2[1], 42)), h('span.source-name', {}, s2[2])));
      });
      wrap.appendChild(srcRow);

      /* 账户 */
      var accSel = h('select.field-input');
      S.db.accounts.forEach(function (a) {
        accSel.appendChild(h('option', { value: a.id, selected: a.id === defaultAccount() }, a.icon + ' ' + a.name));
      });
      accSel.addEventListener('change', function () { IMP.accountId = accSel.value; });
      wrap.appendChild(h('div.card.inline-form', {},
        h('div.field', {}, h('span.field-label', {}, '导入到账户'), accSel),
        h('div.field-hint', {}, '导入后该账户余额会自动结算。微信/支付宝账单建议对应各自的账户。')));

      /* 文件 */
      wrap.appendChild(UI.sectionTitle('2. 上传账单文件'));
      var fileInput = h('input', { type: 'file', multiple: true, accept: '.csv,.txt,.xlsx,.xls', style: { display: 'none' } });
      fileInput.addEventListener('change', function () { pickFiles(Array.prototype.slice.call(fileInput.files)); });
      var drop = h('div.drop-zone', { onclick: function () { fileInput.click(); } },
        UI.illust('import', 76),
        h('div.drop-title', {}, '点击选择账单文件'),
        h('div.drop-desc', {}, '支持微信支付账单 CSV、支付宝账单 CSV、银行流水 CSV/Excel（.xlsx）'),
        h('div.drop-desc.small', {}, '文件只在本机解析，不会上传到任何服务器'));
      ['dragover', 'dragenter'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
      ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
      drop.addEventListener('drop', function (e) { pickFiles(Array.prototype.slice.call(e.dataTransfer.files)); });
      wrap.appendChild(fileInput);
      wrap.appendChild(drop);

      wrap.appendChild(h('div.row-btns', {},
        h('button.btn.ghost', { onclick: function () { V.manualSheet(function () { UI.render(); }); } }, UI.icon('edit', 16) + ' 手动补录'),
        h('button.btn.ghost', { onclick: ocrSheet }, UI.icon('camera', 16) + ' 截图导入'),
        h('button.btn.ghost', { onclick: function () { UI.go('me', { tab: 'rules' }); } }, UI.icon('sparkle', 16) + ' 规则库')));

      /* 已选文件 */
      if (IMP.files.length) {
        var fl = h('div.card.file-list');
        IMP.files.forEach(function (f, i) {
          fl.appendChild(h('div.file-row', {},
            h('span', {}, '📄'),
            h('div.file-mid', {}, h('div', {}, f.name), h('div.dim', {}, (f.size / 1024).toFixed(1) + ' KB')),
            h('button.icon-btn', { onclick: function () { IMP.files.splice(i, 1); IMP.results = null; UI.render(); } }, UI.icon('close', 16))));
        });
        wrap.appendChild(fl);
        if (!IMP.results) {
          wrap.appendChild(h('button.btn.block.primary', { onclick: doParse }, IMP.busy ? '解析中…' : '开始解析 ' + IMP.files.length + ' 个文件'));
        }
      }

      /* 解析结果 */
      if (IMP.results) {
        wrap.appendChild(UI.sectionTitle('3. 解析结果预览'));
        var totalNew = 0, totalDup = 0, totalSkip = 0, totalEx = 0;
        IMP.results.files.forEach(function (r) {
          var card = h('div.card.parse-card');
          var meta = P.SOURCE_META[r.source] || P.SOURCE_META.generic;
          card.appendChild(h('div.parse-head', {},
            h('span.parse-src', { style: { background: meta.color + '22', color: meta.color } }, meta.icon + ' ' + meta.name),
            h('span.parse-file', {}, r.file)));
          if (!r.ok) {
            card.appendChild(h('div.parse-error', {}, '❌ ' + r.error));
            wrap.appendChild(card);
            return;
          }
          var dup = 0, ex = 0;
          r.txns.forEach(function (t) {
            if (P.SOURCE_META && t.direction === 'transfer') ex++;
            if (FA.cat.findDuplicate(t, S.db.txns)) dup++;
          });
          totalNew += r.txns.length - dup; totalDup += dup; totalSkip += r.skipped.length; totalEx += ex;
          card.appendChild(h('div.parse-stats', {},
            h('div.ps', {}, h('b', {}, String(r.txns.length)), h('span', {}, '笔交易')),
            h('div.ps', {}, h('b', {}, String(r.txns.length - dup)), h('span', {}, '笔可新增')),
            h('div.ps', {}, h('b', {}, String(dup)), h('span', {}, '笔重复(将跳过)')),
            h('div.ps', {}, h('b', {}, String(r.skipped.length)), h('span', {}, '行跳过'))));
          card.appendChild(h('div.parse-meta', {},
            h('span', {}, '编码 ' + (r.encoding || '—')),
            h('span', {}, '表头第 ' + ((r.header ? r.header.rowIndex : 0) + 1) + ' 行'),
            r.sheetName ? h('span', {}, '工作表 ' + r.sheetName) : null,
            h('span', {}, '识别字段 ' + Object.keys(r.header ? r.header.map : {}).length + '/13')));
          /* 字段映射 */
          var mapRow = h('div.map-row');
          Object.keys(r.header.map).forEach(function (f) {
            mapRow.appendChild(h('span.map-chip', {}, (r.headerNames[r.header.map[f]] || f) + ' → ' + f));
          });
          card.appendChild(mapRow);
          /* 交易预览 */
          var prev = h('div.preview-list');
          r.txns.slice(0, 8).forEach(function (t) {
            var cl = FA.cat.classify(t, { corrections: S.db.corrections, model: FA.cat.buildModel(S.db) });
            prev.appendChild(h('div.preview-row', {},
              h('span.pr-time', {}, U.fmtDate(t.time, 'md')),
              h('span.pr-merchant', {}, (t.merchant || '').slice(0, 12)),
              h('span.pr-cat', { style: { color: S.cat(cl.category).color } }, S.cat(cl.category).icon + ' ' + S.catName(cl.category)),
              h('span.pr-amt.' + (t.direction === 'income' ? 'pos' : 'dim'), {}, (t.direction === 'income' ? '+' : '-') + UI.money(t.amount))));
          });
          if (r.txns.length > 8) prev.appendChild(h('div.dim.more', {}, '还有 ' + (r.txns.length - 8) + ' 笔…'));
          card.appendChild(prev);
          if (r.skipped.length) {
            card.appendChild(h('details.skip-detail', {}, h('summary', {}, '跳过的 ' + r.skipped.length + ' 行原因'),
              h('div.skip-list', {}, r.skipped.slice(0, 12).map(function (s2) {
                return h('div.skip-line', {}, '第 ' + (s2.row + 1) + ' 行：' + s2.reason);
              }))));
          }
          wrap.appendChild(card);
        });
        wrap.appendChild(h('div.card.import-summary', {},
          h('div', {}, '共解析 ' + IMP.results.files.reduce(function (a, r) { return a + (r.txns || []).length; }, 0) + ' 笔，可新增 ' + totalNew + ' 笔'),
          h('div.dim', {}, '重复忽略 ' + totalDup + ' 笔 · 行异常 ' + totalSkip + ' 行 · 转账/资金划转 ' + totalEx + ' 笔（不计入收支）')));
        wrap.appendChild(h('div.row-btns', {},
          h('button.btn.ghost', { onclick: function () { IMP.results = null; UI.render(); } }, '重新选择'),
          h('button.btn.primary.grow', { onclick: doImport }, '确认导入 ' + totalNew + ' 笔')));
      }

      /* 说明 */
      wrap.appendChild(h('div.tips', {},
        h('b', {}, '📖 如何导出账单'),
        h('div', {}, '微信：我 → 服务 → 钱包 → 账单 → 常见问题 → 下载账单 → 用于个人对账 → 选择时间范围，收到邮件后解压得到 CSV。'),
        h('div', {}, '支付宝：我的 → 账单 → 右上角 … → 开具交易流水证明 → 用于个人对账 → 选择时间范围，邮件里下载 CSV。'),
        h('div', {}, '银行：手机银行 App → 交易明细 → 导出（Excel/CSV）。')));

      return wrap;
    }
  });

  function pickFiles(files) {
    if (!files || !files.length) return;
    files.forEach(function (f) { IMP.files.push(f); });
    IMP.results = null;
    UI.render();
    doParse();
  }
  function doParse() {
    if (!IMP.files.length || IMP.busy) return;
    IMP.busy = true;
    IMP.step = 3;
    UI.render();
    P.ingest(IMP.files, { source: IMP.source, accountId: defaultAccount() }).then(function (res) {
      IMP.results = res;
      IMP.busy = false;
      if (res.files.every(function (f) { return !f.ok; })) UI.toast('没有解析出交易，请检查文件格式', 'error');
      else UI.toast('解析完成');
      UI.render();
    }).catch(function (e) {
      IMP.busy = false;
      UI.toast('解析失败：' + e.message, 'error');
      UI.render();
    });
  }

  function doImport() {
    var added = 0, dup = 0, transferred = 0, adjusted = 0;
    var incoming = [];
    IMP.results.files.forEach(function (r) {
      (r.txns || []).forEach(function (t) { incoming.push(t); });
    });
    var model = FA.cat.buildModel(S.db);
    incoming.forEach(function (t) {
      var d = FA.cat.findDuplicate(t, S.db.txns.concat(incoming.filter(function (x) { return x._done; })));
      if (d) { dup++; return; }
      t.accountId = t.accountId || defaultAccount();
      var cl = FA.cat.classify(t, { corrections: S.db.corrections, model: model });
      t.category = cl.category; t.sub = cl.sub;
      t.auto = { source: cl.source, confidence: cl.confidence, at: Date.now() };
      if (cl.tags && cl.tags.length) t.tags = U.uniq((t.tags || []).concat(cl.tags));
      t._done = 1;
      S.db.txns.push(t);
      added++;
      if (t.direction === 'transfer') { t.excluded = true; transferred++; }
    });
    /* 自动识别内部转账与退款关联 */
    var tr = FA.cat.detectTransfers(S.db);
    tr.forEach(function (x) {
      if (!x.txn.excluded && x.confidence >= 0.85) {
        x.txn.excluded = true; x.txn.direction = 'transfer'; x.txn.category = 'transfer';
        x.txn.auto = Object.assign({}, x.txn.auto, { transfer: x.reason });
        adjusted++;
      }
    });
    S.add('imports', {
      at: Date.now(), files: IMP.files.map(function (f) { return f.name; }), source: IMP.source,
      accountId: defaultAccount(), added: added, dup: dup, transferred: transferred + adjusted, adjusted: adjusted
    });
    S.save(true);
    FA.cat.autoLabel(S.db);
    UI.sheet({
      title: '导入完成 🎉',
      body: h('div.import-done', {},
        h('div.done-stats', {},
          h('div.ds', {}, h('b.income', {}, String(added)), h('span', {}, '笔新增')),
          h('div.ds', {}, h('b.dim', {}, String(dup)), h('span', {}, '笔重复跳过')),
          h('div.ds', {}, h('b', {}, String(transferred + adjusted)), h('span', {}, '笔转账已排除'))),
        h('div.tips', {}, '已按规则库 + 你的历史习惯自动分类。在「流水」里长按可批量修改，修改后会自动记住该商户。'),
        h('div.row-btns', {},
          h('button.btn.ghost', { onclick: function () { IMP.files = []; IMP.results = null; IMP.step = 1; UI.go('txns'); } }, '查看流水'),
          h('button.btn.primary.grow', { onclick: function () { IMP.files = []; IMP.results = null; IMP.step = 1; UI.go('report'); } }, '看月度报告'))),
      onClose: function () { IMP.files = []; IMP.results = null; IMP.step = 1; UI.render(); }
    });
  }

  function historySheet() {
    var list = (S.db.imports || []).slice().reverse();
    UI.sheet({
      title: '导入历史', subtitle: list.length + ' 次导入',
      body: list.length ? h('div.notif-list', {}, list.map(function (it) {
        return h('div.notif-item', {},
          h('span.notif-ic', {}, (P.SOURCE_META[it.source] || {}).icon || '📄'),
          h('div', {}, h('div.notif-title', {}, (it.files || []).join('、') || '手动导入'),
            h('div.notif-desc', {}, U.fmtDate(it.at, 'full') + ' · 新增 ' + it.added + ' 笔 · 跳过重复 ' + it.dup + ' 笔' + (it.transferred ? ' · 转账 ' + it.transferred + ' 笔' : ''))));
      })) : UI.empty('import', '还没有导入记录')
    });
  }

  /* ---------------- 截图 OCR ---------------- */
  function ocrSheet() {
    var input = h('input', { type: 'file', multiple: true, accept: 'image/*', style: { display: 'none' } });
    var area = h('div.ocr-area');
    var engineNote = h('div.tips', {}, P.ocrAvailable()
      ? '✅ 已检测到本地 OCR 引擎（Tesseract），识别在设备上完成，图片不会外传。'
      : 'ℹ️ 未安装离线 OCR 模型：仍可导入截图并快速手工补录（金额、商户、日期会尽量预填）。若要开启文字识别，可把 Tesseract.js 的离线包放入 js/vendor/ 并在 index.html 中引入。');
    var body = h('div', {},
      h('div.drop-zone', { onclick: function () { input.click(); } },
        UI.illust('ocr', 76), h('div.drop-title', {}, '选择微信/支付宝的支付截图'),
        h('div.drop-desc', {}, '可一次选择多张，逐张确认后入账')),
      input, engineNote, area);
    input.addEventListener('change', function () {
      var files = Array.prototype.slice.call(input.files);
      if (!files.length) return;
      area.appendChild(h('div.dim', {}, '正在处理 ' + files.length + ' 张图片…'));
      files.reduce(function (chain, f, i) {
        return chain.then(function () {
          return U.downscale(f, 640, 0.6).then(function (img) {
            var mid = U.uid('img');
            if (img) S.putMedia(mid, img.url);
            return P.ocrImage(f).then(function (r) {
              var cand = (r.candidates && r.candidates[0]) || {};
              addOcrCard(area, { file: f, mediaId: mid, text: r.text, engine: r.engine, cand: cand });
            });
          });
        });
      }, Promise.resolve());
    });
    UI.sheet({ title: '截图导入 / OCR', subtitle: '本地处理，不上传', body: body, size: 'full' });
  }
  function addOcrCard(area, o) {
    var amtEl = h('input.field-input', { type: 'number', inputmode: 'decimal', placeholder: '金额', value: o.cand.amount || '' });
    var merEl = h('input.field-input', { placeholder: '商户', value: o.cand.merchant || '' });

    S.catList('expense').forEach(function (c) { catSel.appendChild(h('option', { value: c.id }, c.icon + ' ' + c.name)); });
    var accSel = h('select.field-input');
    S.db.accounts.forEach(function (a) { accSel.appendChild(h('option', { value: a.id, selected: a.id === defaultAccount() }, a.icon + ' ' + a.name)); });

      url ? h('img.ocr-img', { src: url, onclick: function () { UI.sheet({ title: '截图凭证', body: h('img', { src: url, style: { width: '100%', borderRadius: '16px' } }) }); } }) : null,
      h('div.ocr-fields', {},
        amtEl, merEl, dateEl, catSel, accSel),
      h('div.ocr-evidence', {}, '识别依据：' + (o.cand.evidence || (o.engine === 'none' ? '未启用 OCR，请手动填写' : '—'))),
      h('div.row-btns', {},
        h('button.btn.ghost', { onclick: function () { card.remove(); } }, '丢弃'),
        h('button.btn.primary.grow', {

              accountId: accSel.value, category: catSel.value, time: U.parseDate(dateEl.value), tags: ['OCR']

    area.appendChild(card);
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>/* ==== js/views-report.js ==== */
/* FlowAtlas · 月度报告页 */
(function (root) {
  'use strict';
  var FA = root.FA, U = FA.util, UI = FA.ui, S = FA.store, h = UI.h;
  var V = FA.views;
  var RPT_YM = null;

  /* 画布宽度 = 视口宽 - 页面左右内边距(32) - 卡片左右内边距(32) */
  function cw() { return Math.max(240, Math.min(document.documentElement.clientWidth - 64, 528)); }

  function exportActions(r) {

      { icon: 'image', label: '保存为分享长图', hint: '适合发朋友圈/微信群', onTap: function () { saveCard(r); } },
      { icon: 'doc', label: '导出当月明细 CSV', onTap: function () { U.download('FlowAtlas-' + r.ym + '.csv', FA.report.toCSV(r.ym), 'text/csv;charset=utf-8'); UI.toast('已导出 CSV'); } },
      { icon: 'download', label: '打印 / 存为 PDF', onTap: function () { printReport(r); } },
      { icon: 'link', label: '复制文字摘要', onTap: function () { U.copyToClipboard(textSummary(r)).then(function () { UI.toast('摘要已复制'); }); } }
    ]);
  }
  function dataURLtoBlob(d) {
    var parts = String(d).split(','), mime = (parts[0].match(/:(.*?);/) || [])[1] || 'application/octet-stream';
    var bin = atob(parts[1]), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  function saveCard(r) {
    UI.toast('正在生成高清长图…');
    setTimeout(function () {
      try {
        var t = FA.report.shareCard(r);
        U.download('FlowAtlas-' + r.ym + '-报告.png', dataURLtoBlob(t.dataURL), 'image/png');
        UI.toast(U.native() ? '长图已保存到「下载」目录' : '长图已保存到下载目录');
      } catch (e) { UI.toast('生成失败：' + e.message, 'error'); }

  }
  function textSummary(r) {
    var lines = ['【' + r.label + ' 财务报告】', '支出 ' + U.money(r.expense) + '｜收入 ' + U.money(r.income) + '｜结余 ' + U.money(r.net), '储蓄率 ' + Math.round(r.savingsRate * 100) + '%｜日均 ' + U.money(r.avgDaily), ''];
    r.cats.slice(0, 5).forEach(function (c, i) { lines.push((i + 1) + '. ' + c.name + ' ' + U.money(c.total) + '（' + Math.round((c.total / (r.expense || 1)) * 100) + '%）'); });
    lines.push('');
    r.insights.slice(0, 4).forEach(function (x) { lines.push(x.icon + ' ' + x.text); });
    lines.push('', '—— 由 FlowAtlas 本地账本生成');
    return lines.join('\n');
  }
  function printReport(r) {
    var w = window.open('', '_blank');
    if (!w) { UI.toast('浏览器拦截了弹窗', 'error'); return; }
    var rows = r.cats.map(function (c) {
      return '<tr><td>' + c.icon + ' ' + U.escapeHtml(c.name) + '</td><td>' + c.count + '</td><td style="text-align:right">' + U.money(c.total) + '</td><td style="text-align:right">' + Math.round((c.total / (r.expense || 1)) * 100) + '%</td></tr>';
    }).join('');
    var mrows = r.topMerchants.slice(0, 8).map(function (m) {
      return '<tr><td>' + U.escapeHtml(m.name) + '</td><td>' + m.count + '</td><td style="text-align:right">' + U.money(m.total) + '</td></tr>';
    }).join('');
    var irows = r.insights.map(function (x) { return '<li>' + x.icon + ' ' + U.escapeHtml(x.text) + '</li>'; }).join('');
    var brows = r.budgets.map(function (b) {

    }).join('');
    var html = '<!doctype html><html><head><meta charset="utf-8"><title>' + r.label + ' 财务报告</title>' +
      '<style>body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:28px;color:#111}h1{font-size:22px;margin:0 0 4px}.sub{color:#666;font-size:12px;margin-bottom:18px}' +
      '.grid{display:flex;gap:10px;margin:16px 0}.box{flex:1;border:1px solid #eee;border-radius:10px;padding:12px}.box b{display:block;font-size:20px}.box span{font-size:12px;color:#666}' +
      'table{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:13px}th,td{border-bottom:1px solid #eee;padding:7px 4px;text-align:left}th{color:#666;font-weight:500}' +
      'h2{font-size:15px;margin:20px 0 6px}li{font-size:13px;margin:4px 0}@media print{body{padding:0}}</style></head><body>' +

      '<div class="grid"><div class="box"><span>支出</span><b style="color:#d33">' + U.money(r.expense) + '</b></div>' +
      '<div class="box"><span>收入</span><b style="color:#1a9e4b">' + U.money(r.income) + '</b></div>' +
      '<div class="box"><span>结余</span><b style="color:#2563eb">' + U.money(r.net) + '</b></div>' +
      '<div class="box"><span>储蓄率</span><b>' + Math.round(r.savingsRate * 100) + '%</b></div></div>' +
      '<h2>支出构成</h2><table><tr><th>分类</th><th>笔数</th><th style="text-align:right">金额</th><th style="text-align:right">占比</th></tr>' + rows + '</table>' +
      '<h2>消费最多</h2><table><tr><th>商户</th><th>笔数</th><th style="text-align:right">金额</th></tr>' + mrows + '</table>' +
      (brows ? '<h2>预算执行</h2><table><tr><th>预算</th><th style="text-align:right">已用 / 总额</th><th style="text-align:right">进度</th></tr>' + brows + '</table>' : '') +
      '<h2>本月洞察</h2><ul>' + irows + '</ul>' +
      '<h2>资产负债</h2><p>资产 ' + U.money(r.assets) + ' · 负债 ' + U.money(r.debts) + ' · 净资产 <b>' + U.money(r.netWorth) + '</b></p>' +
      '</body></html>';
    w.document.write(html);

    setTimeout(function () { try { w.focus(); w.print(); } catch (e) { } }, 400);
  }

  FA.ui.register('report', {
    tab: 'report',
    title: function () { return (RPT_YM ? U.monthLabel(RPT_YM) : U.monthLabel(U.ym(Date.now()))) + ' 报告'; },
    actions: function () {
      var ym = RPT_YM || U.ym(Date.now());
      return [
        { icon: 'image', label: '导出', onTap: function () { exportActions(FA.report.build(ym)); } },
        { icon: 'calendar', label: '选择月份', onTap: function () { V.reportMonthPicker(); } }
      ];
    },
    render: function (p) {
      if (p.m) RPT_YM = p.m;
      var ym = RPT_YM || U.ym(Date.now());
      var r = FA.report.build(ym);
      var wrap = h('div.page.report');

      /* 月份切换 */
      wrap.appendChild(h('div.report-months', {}, FA.report.availableMonths().slice(0, 12).map(function (m) {
        return h('button.chip' + (m === ym ? '.on' : ''), { onclick: function () { RPT_YM = m; UI.go('report', { m: m }, true); } }, U.monthLabel(m).replace('年', '/').replace('月', ''));
      })));

      /* 概览 */
      wrap.appendChild(h('div.card.report-hero', {},
        h('div.rh-grid', {},
          h('div.rh-cell', {}, h('span.rh-k', {}, '支出'), h('span.rh-v.expense', {}, UI.money(r.expense)),
            r.deltaExpense != null ? h('span.rh-d' + (r.deltaExpense > 0 ? '.up' : '.down'), {}, (r.deltaExpense > 0 ? '↑' : '↓') + Math.abs(Math.round(r.deltaExpense * 100)) + '% 环比') : null),
          h('div.rh-cell', {}, h('span.rh-k', {}, '收入'), h('span.rh-v.income', {}, UI.money(r.income)),
            r.deltaIncome != null ? h('span.rh-d' + (r.deltaIncome > 0 ? '.up' : '.down'), {}, (r.deltaIncome > 0 ? '↑' : '↓') + Math.abs(Math.round(r.deltaIncome * 100)) + '% 环比') : null),
          h('div.rh-cell', {}, h('span.rh-k', {}, '结余'), h('span.rh-v.' + (r.net >= 0 ? 'income' : 'expense'), {}, UI.money(r.net)),
            h('span.rh-d', {}, '储蓄率 ' + Math.round(r.savingsRate * 100) + '%')),
          h('div.rh-cell', {}, h('span.rh-k', {}, '日均支出'), h('span.rh-v', {}, UI.money(r.avgDaily)),
            h('span.rh-d', {}, r.activeDays + '/' + r.daysInMonth + ' 天有消费')))));

      /* 洞察 */
      if (r.insights.length) {
        wrap.appendChild(UI.sectionTitle('自动洞察', null, 'insight'));
        wrap.appendChild(h('div.insight-list', {}, r.insights.map(function (x) {
          return h('div.insight-row.' + x.tone, {}, h('span.ins-ic', {}, x.icon), h('span', {}, x.text));
        })));
      }

      /* 支出构成 */
      var donut = h('canvas');
      var trend = h('canvas');
      var heat = h('canvas');
      var rank = h('canvas');
      wrap.appendChild(UI.sectionTitle('支出构成', h('span.link', { onclick: function () { UI.go('txns'); } }, '看流水'), 'report'));
      var catCard = h('div.card.cat-card', {}, h('div.donut-wrap', {}, donut));
      var legend = h('div.legend');
      r.cats.forEach(function (c) {
        legend.appendChild(h('div.legend-row', {
          onclick: function () { V.catDetailSheet(c, ym); }
        },
          h('span.legend-dot', { style: { background: c.color } }),
          h('span.legend-name', {}, c.icon + ' ' + c.name),
          h('span.legend-count', {}, c.count + ' 笔'),
          h('span.legend-amt', {}, UI.money(c.total)),
          h('span.legend-pct', {}, Math.round((c.total / (r.expense || 1)) * 100) + '%')));
      });
      catCard.appendChild(legend);

      /* 趋势 */

      wrap.appendChild(h('div.card', {}, h('div.chart-legend', {},
        h('span', {}, h('i.dot', { style: { background: '#22C55E' } }), '收入'),
        h('span', {}, h('i.dot', { style: { background: '#FF6B6B' } }), '支出')),
        trend));

      /* 热力图 */
      wrap.appendChild(UI.sectionTitle('每日消费热力图', null, 'month'));
      wrap.appendChild(h('div.card', {}, heat, h('div.heat-legend', {}, h('span.dim', {}, '少'), h('i.hl', { style: { background: 'rgba(148,163,184,.15)' } }), h('i.hl', { style: { background: 'hsl(120,85%,72%)' } }), h('i.hl', { style: { background: 'hsl(60,85%,64%)' } }), h('i.hl', { style: { background: 'hsl(0,85%,56%)' } }), h('span.dim', {}, '多'))));

      /* Top 商户 */
      wrap.appendChild(UI.sectionTitle('消费最多的商户', null, 'shopping'));
      wrap.appendChild(h('div.card', {}, rank));

      /* 异常 */
      if (r.anomalies.length) {
        wrap.appendChild(UI.sectionTitle('异常交易提醒 (' + r.anomalies.length + ')', null, 'alert'));
        var ac = h('div.card.list-card');
        r.anomalies.slice(0, 8).forEach(function (a2) {
          ac.appendChild(h('div.anomaly-row', { onclick: function () { V.txnSheet(a2.txn.id, UI.render); } },
            h('span.anomaly-ic', {}, a2.type === 'duplicate' ? '👯' : a2.type === 'night' ? '🌙' : '💥'),
            h('div.anomaly-mid', {}, h('div', {}, (a2.txn.merchant || '').slice(0, 16)), h('div.dim', {}, a2.reason + ' · ' + U.fmtDate(a2.txn.time, 'md'))),
            h('span.money.expense', {}, UI.money(a2.txn.amount))));
        });
        wrap.appendChild(ac);
      }

      /* 预算执行 */
      if (r.budgets.length) {
        wrap.appendChild(UI.sectionTitle('预算执行', h('span.link', { onclick: function () { UI.go('plan', { tab: 'budget' }); } }, '管理'), 'budget'));
        wrap.appendChild(h('div.card', {}, r.budgets.map(function (b) {
          var col = b.pct > 1 ? '#EF4444' : b.pct > 0.8 ? '#F59E0B' : b.color;

            h('div.bm-top', {}, h('span', {}, b.icon + ' ' + b.name),

      wrap.appendChild(h('div.row-btns', {},

  V.reportMonthPicker = function () {

          onclick: function () { RPT_YM = m; UI.go('report', { m: m }, true); }

      }))

  V.catDetailSheet = function (c, ym) {
    var subs = Object.keys(c.subs || {}).map(function (k) { return { name: k, total: c.subs[k] }; });

      size: 'full',
      body: h('div', {},
        subs.length > 1 ? h('div.chips-input', {}, subs.map(function (s2) { return h('span.chip', {}, s2.name + ' ' + U.money(s2.total)); })) : null,
        h('div.card.list-card', {}, list.slice(0, 50).map(function (t) { return V.txnRow(t, { after: UI.render }); })))

  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

        var y = base.getFullYear(), m = base.getMonth(), days = new Date(y, m + 1, 0).getDate();
        /* 固定收支 */
        push({ time: new Date(y, m, 10, 9, 30).getTime(), amount: Math.round(rnd(11800, 15200)), direction: 'income', accountId: 'acc_bank', merchant: '某某科技有限公司', item: '工资', category: 'salary', sub: '工资', source: 'bank', orderNo: 'SAL' + y + m });
        if (back > 0) push({ time: new Date(y, m, 5, 10, 0).getTime(), amount: 3200, direction: 'expense', accountId: 'acc_bank', merchant: '房东王先生', item: '房租', category: 'housing', sub: '房租', source: 'bank', orderNo: 'RENT' + y + m });
        push({ time: new Date(y, m, 15, 8, 0).getTime(), amount: 25, direction: 'expense', accountId: 'acc_alipay', merchant: 'Netflix', item: '会员订阅', category: 'fun', sub: '订阅服务', source: 'alipay', orderNo: 'NFLX' + y + m, tags: ['订阅'] });
        push({ time: new Date(y, m, 15, 8, 5).getTime(), amount: 15, direction: 'expense', accountId: 'acc_alipay', merchant: '网易云音乐', item: '会员订阅', category: 'fun', sub: '订阅服务', source: 'alipay', orderNo: 'NETEASE' + y + m, tags: ['订阅'] });
        push({ time: new Date(y, m, 20, 8, 0).getTime(), amount: 19, direction: 'expense', accountId: 'acc_wechat', merchant: '腾讯视频', item: '会员订阅', category: 'fun', sub: '订阅服务', source: 'wechat', orderNo: 'TXSP' + y + m, tags: ['订阅'] });
        push({ time: new Date(y, m, 12, 20, 0).getTime(), amount: 68, direction: 'expense', accountId: 'acc_wechat', merchant: '中国移动', item: '话费充值', category: 'telecom', sub: '话费', source: 'wechat', orderNo: 'YD' + y + m });
        /* 日常随机 */
        for (var d = 1; d <= days; d++) {
          var isFuture = back === 0 && d > new Date().getDate();
          if (isFuture) break;
          var cnt = Math.random() < 0.22 ? 0 : Math.ceil(rnd(0.7, 2.6));
          for (var i = 0; i < cnt; i++) {
            var mch = DEMO[Math.floor(Math.random() * DEMO.length)];
            if (Math.random() > (mch[5] == null ? 1 : Math.min(1, mch[5] / 2))) continue;
            var amt = Math.round(rnd(mch[1], mch[2]) * 100) / 100;
            push({
              time: new Date(y, m, d, Math.floor(rnd(7, 22)), Math.floor(rnd(0, 59))).getTime(),
              amount: amt, direction: 'expense', accountId: pick(), merchant: mch[0],
              item: mch[4], category: mch[3], sub: mch[4], source: Math.random() < 0.5 ? 'wechat' : 'alipay',
              orderNo: 'D' + y + m + d + i + Math.floor(Math.random() * 9999)
            });
          }
        }
        /* 少量大额 + 一个异常 */
        if (back === 1 || back === 2) push({ time: new Date(y, m, 18, 21, 0).getTime(), amount: Math.round(rnd(800, 2600)), direction: 'expense', accountId: 'acc_bank', merchant: '京东', item: '笔记本电脑配件', category: 'shopping', sub: '数码', source: 'bank', orderNo: 'BIG' + y + m });
        if (back === 1) push({ time: new Date(y, m, 22, 2, 30).getTime(), amount: 1280, direction: 'expense', accountId: 'acc_alipay', merchant: '某某数码旗舰店', item: '耳机', category: 'shopping', sub: '数码', source: 'alipay', orderNo: 'NIGHT' + y + m });
        push({ time: new Date(y, m, 25, 12, 0).getTime(), amount: Math.round(rnd(120, 400)), direction: 'income', accountId: 'acc_wechat', merchant: '朋友转账', item: 'AA收款', category: 'reimburse', sub: 'AA收款', source: 'wechat', orderNo: 'AA' + y + m });
      }
      /* 内部转账示例：零钱提现到银行卡 */
      push({ time: now - 3 * 86400000, amount: 500, direction: 'transfer', accountId: 'acc_wechat', transferTo: 'acc_bank', merchant: '零钱提现', item: '提现到银行卡', category: 'transfer', sub: '提现', source: 'wechat', excluded: true, orderNo: 'WD001' });
      /* 初始余额 */
      S.db.accounts.forEach(function (a) {
        if (a.type === 'bank') a.initial = 8600;
        else if (a.type === 'wechat') a.initial = 420;
        else if (a.type === 'alipay') a.initial = 1250;
        else a.initial = 300;
      });
      /* 预算 / 目标 / 债务 / 订阅 */
      S.db.budgets = [
        { id: 'b1', name: '餐饮月预算', amount: 2200, categories: ['food'], icon: '🍜', color: '#FF6B6B', period: 'monthly' },
        { id: 'b2', name: '交通出行', amount: 600, categories: ['transport'], icon: '🚕', color: '#4D96FF', period: 'monthly' },
        { id: 'b3', name: '购物娱乐', amount: 1500, categories: ['shopping', 'fun'], icon: '🛍️', color: '#F473B9', period: 'monthly' },
        { id: 'b4', name: '生活总预算', amount: 6000, categories: [], icon: '🏠', color: '#2ED3B7', period: 'monthly' }
      ];
      S.db.goals = [
        { id: 'g1', name: '应急备用金', targetAmount: 30000, saved: 12500, icon: '🛟', color: '#22C55E', deadline: Date.now() + 300 * 86400000, contributions: [] },
        { id: 'g2', name: '日本旅行基金', targetAmount: 15000, saved: 4200, icon: '✈️', color: '#4D96FF', deadline: Date.now() + 240 * 86400000, contributions: [] },
        { id: 'g3', name: '换新手机', targetAmount: 6000, saved: 3100, icon: '📱', color: '#8E7CFF', deadline: Date.now() + 120 * 86400000, contributions: [] }
      ];
      S.db.debts = [
        { id: 'd1', name: '招商银行信用卡', type: '信用卡', principal: 20000, balance: 6840, apr: 0.1825, minPayment: 700, dueDay: 18, icon: '💳', color: '#EF4444', status: 'active', payments: [] },
        { id: 'd2', name: '花呗分期', type: '花呗/白条', principal: 6000, balance: 2100, apr: 0.088, minPayment: 520, dueDay: 9, icon: '💙', color: '#4D96FF', status: 'active', payments: [] },
        { id: 'd3', name: '消费贷', type: '消费贷', principal: 50000, balance: 32000, apr: 0.0435, minPayment: 1800, dueDay: 25, icon: '🏦', color: '#8E7CFF', status: 'active', payments: [] }
      ];
      S.db.subs = [
        { id: 's1', name: 'Netflix', amount: 25, cycle: 'monthly', category: 'fun', sub: '订阅服务', nextDate: now + 5 * 86400000, lastDate: now - 25 * 86400000, status: 'active', icon: '🎬', color: '#EF4444' },
        { id: 's2', name: '网易云音乐', amount: 15, cycle: 'monthly', category: 'fun', sub: '订阅服务', nextDate: now + 12 * 86400000, lastDate: now - 18 * 86400000, status: 'active', icon: '🎵', color: '#F473B9' },
        { id: 's3', name: '腾讯视频', amount: 19, cycle: 'monthly', category: 'fun', sub: '订阅服务', nextDate: now + 2 * 86400000, lastDate: now - 28 * 86400000, status: 'active', icon: '📺', color: '#4D96FF' },
        { id: 's4', name: '百度网盘超级会员', amount: 178, cycle: 'yearly', category: 'telecom', sub: '软件会员', nextDate: now + 90 * 86400000, lastDate: now - 275 * 86400000, status: 'active', icon: '☁️', color: '#2ED3B7' }
      ];
      FA.cat.autoLabel(S.db);
      S.save(true);
      return n;
    }
  };

  /* ---------------- 首次运行 ---------------- */
  function firstRun() {
    S.db.settings.onboarded = true;
    S.save(true);
    UI.sheet({
      title: '欢迎使用 FlowAtlas 🎉',
      subtitle: '本地优先的账单管家 · 数据只存在你的手机里',
      dismissable: false,
      body: h('div.about', {},
        h('p', {}, '三步开始：'),
        h('ol', {},
          h('li', {}, '在微信/支付宝里导出账单（CSV）'),
          h('li', {}, '点底部 ➕ 选择文件，自动识别、自动分类'),
          h('li', {}, '设置预算、目标、债务、订阅，每月自动生成报告')),
        h('div.row-btns.col', {},
          h('button.btn.primary.block', { onclick: function () { close(); UI.go('import'); } }, '📥 立即导入真实账单'),
          h('button.btn.block', { onclick: function () { var n = FA.demo.seed(); close(); UI.toast('已载入 ' + n + ' 笔示例数据'); UI.render(); } }, '🎲 先载入示例数据体验'),
          h('button.btn.ghost.block', { onclick: function () { close(); FA.views.manualSheet(); } }, '✍️ 手动记一笔')))
    });
    var close = UI.$('.sheet-panel') ? function () { var o = UI.$('#sheet-root .sheet-overlay'); if (o) o.querySelector('.sheet-panel').close(); } : function () { };
  }

  /* ---------------- 锁屏 ---------------- */
  function showLock() {
    var input = h('input.field-input.lock-input', { type: 'password', placeholder: '••••••', autocomplete: 'current-password' });
    var err = h('div.lock-err');
    var lock = h('div#lock', {},
      h('div.lock-logo', {}, '🔐'),
      h('div.lock-title', {}, 'FlowAtlas 已锁定'),
      h('div.lock-sub', {}, '输入密码解锁本地账本（数据以 AES-256-GCM 加密存储）'),
      input, err,
      h('button.btn.primary', { onclick: tryUnlock, style: { width: 'min(300px,78vw)' } }, '解锁'));
    document.body.appendChild(lock);
    setTimeout(function () { input.focus(); }, 200);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryUnlock(); });
    function tryUnlock() {
      var p = input.value;
      if (!p) return;
      err.textContent = '正在解密…';
      S.unlock(p).then(function () {
        lock.remove();
        UI.applyTheme();
        start();
        UI.toast('欢迎回来');
      }).catch(function () {
        err.textContent = '密码不正确，请重试';
        input.value = '';
        if (navigator.vibrate) { try { navigator.vibrate([40, 60, 40]); } catch (e) { } }
      });
    }
  }

  /* ---------------- 启动 ---------------- */
  function start() {
    UI.render();
    if (!S.db.txns.length && !S.db.settings.onboarded) setTimeout(firstRun, 400);
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('./sw.js').catch(function () { });
    }
    window.addEventListener('beforeunload', function () { S.flush(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) S.flush(); });
  }

  function boot() {
    var st = S.load();
    UI.applyTheme();
    if (root.matchMedia) {
      try {
        root.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
          if ((S.db.settings.theme || 'auto') === 'auto') UI.applyTheme();
        });
      } catch (e) { }
    }
    if (st.locked) showLock(); else start();
    /* 支持 ?demo=1 快速载入示例 */
    if (/[?&]demo=1/.test(location.search) && !S.db.txns.length) {
      FA.demo.seed(); UI.toast('已载入示例数据'); UI.render();
    }
  }

  FA.app = { boot: boot, firstRun: firstRun };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
</body>
</html>
